        <tr><td>Money</td><td>${money.length ? `${money_(sum('contribution'))} put in · ${money_(sum('expense'))} spent · ${money_(sum('revenue'))} earned` : '<span class="muted">nothing recorded</span>'}</td></tr>
      </table></div>
      <div class="card"><h2>Latest update</h2>${ups[0] ? `<p class="muted" style="margin-top:0">${name(ups[0].user_id)}, ${new Date(ups[0].created_at).toLocaleDateString('en-GB')}</p>${ups[0].did ? `<div class="notes">${esc(ups[0].did)}</div>` : ''}` : '<p class="muted">No updates yet.</p>'}
        <a class="btn small ghost" href="#venture/${id}/updates">Post an update</a></div>
      <div class="card"><h2>Members</h2><table>${members.map(m => `<tr><td>${name(m.user_id)}${m.role === 'lead' ? ' <span class="pill gold">lead</span>' : ''}</td><td>${Number(m.share_pct)}%</td></tr>`).join('')}</table>
        ${!closed ? `${nonMembers.length ? `<div class="row" style="margin-top:12px"><select id="addm" style="${selStyle}">${nonMembers.map(p => `<option value="${p.id}">${esc(p.display_name)}</option>`).join('')}</select><button class="btn small ghost" id="addgo">Add to venture</button></div>
          <p class="muted" style="font-size:13px">New members start at 0% and everyone re-agrees the charter.</p>` : ''}
          <div class="row" style="margin-top:12px"><button class="btn small ghost" id="leave">Leave venture</button><button class="btn small danger" id="closev">Close venture…</button></div>
          <form id="clf" class="hidden" style="margin-top:12px"><label for="clo">Outcome</label><select id="clo" style="${selStyle}"><option value="shipped">Shipped</option><option value="sold">Sold</option><option value="shelved">Shelved</option><option value="merged">Merged into something else</option></select>
            <label for="cll">What we learned</label><textarea id="cll" maxlength="3000"></textarea><button class="btn danger" id="clgo">Close it</button></form>` : ''}
      </div></div>`;
    if ($('#sf')) $('#sf').onsubmit = e => { e.preventDefault(); run($('#sgo'), async () => ok(await sb.from('ventures').update({ health: $('#sh').value, next_milestone: $('#sn').value, status_note: $('#ss').value }).eq('id', id))); };
    if ($('#addgo')) $('#addgo').onclick = e => run(e.target, () => rpc('venture_add_member', { p_id: id, p_user: $('#addm').value }));
    if ($('#leave')) $('#leave').onclick = e => {
      if (!e.target.dataset.armed) { e.target.dataset.armed = 1; e.target.textContent = 'Click again to leave'; return; }
      busy(e.target, async () => { await rpc('venture_leave', { p_id: id }); location.hash = 'ventures'; });
    };
    if ($('#closev')) $('#closev').onclick = () => $('#clf').classList.toggle('hidden');
    if ($('#clf')) $('#clf').onsubmit = e => { e.preventDefault(); run($('#clgo'), () => rpc('venture_close', { p_id: id, p_outcome: $('#clo').value, p_learned: $('#cll').value })); };
  }

  else if (tab === 'charter') {
    const c = charter || {};
    const rules = [['time_commitment', 'Time each person commits', 'e.g. 4 hours a week, more around launch'], ['money_commitment', 'Money each person puts in', 'e.g. £100 each up front; more only if everyone agrees'],
      ['decision_rule', 'How decisions get made', ''], ['leaving_rule', 'If someone leaves', ''], ['ip_rule', "Who owns what's made", ''], ['wind_up_rule', 'If we wind it up', '']];
    const iAgreed = agreements.some(a => a.user_id === me.id && a.version === c.version);
    el.innerHTML = `<div class="card"><div class="row"><h2 class="grow" style="margin:0">Charter, version ${c.version}</h2>
        ${!closed ? `<button class="btn small ghost" id="chedit">Edit</button>` : ''}</div>
      <p class="muted">A plain-English record of what you've agreed with each other. It isn't a legal contract. If real money or a company is involved, get a proper agreement too.</p>
      <h3>Shares</h3><table>${members.map(m => `<tr><td>${name(m.user_id)}${m.role === 'lead' ? ' (lead)' : ''}</td><td><b>${Number(m.share_pct)}%</b></td></tr>`).join('')}</table>
      ${rules.map(([k, l]) => `<h3 style="margin-top:14px">${l}</h3><div class="notes">${esc(c[k]) || '<span class="muted">Not filled in yet.</span>'}</div>`).join('')}
      <h3 style="margin-top:16px">Agreed this version</h3>
      <p>${members.map(m => agreedNow.some(a => a.user_id === m.user_id) ? `✅ ${name(m.user_id)}` : `⏳ ${name(m.user_id)}`).join(' &nbsp; ')}</p>
      ${!closed && !iAgreed ? `<button class="btn" id="agree">I agree to version ${c.version}</button>` : !closed ? '<p class="muted">You have agreed this version.</p>' : ''}
    </div>
    <div class="card hidden" id="chf"><h2>Edit charter</h2><p class="muted" style="margin-top:0">Saving creates a new version, and everyone has to agree again.</p><form id="cform">
      <h3>Shares (must add up to 100)</h3>${members.map(m => `<div class="row" style="margin-bottom:6px"><span style="min-width:140px">${name(m.user_id)}</span><input type="number" step="0.01" min="0" max="100" data-share="${m.user_id}" value="${Number(m.share_pct)}" style="width:110px">%</div>`).join('')}
      ${rules.map(([k, l, ph]) => `<label for="c_${k}">${l}</label><textarea id="c_${k}" maxlength="1000" placeholder="${esc(ph)}" style="min-height:60px">${esc(c[k])}</textarea>`).join('')}
      <button class="btn" id="cgo2">Save as version ${(c.version || 0) + 1}</button></form></div>`;
    if ($('#chedit')) $('#chedit').onclick = () => $('#chf').classList.toggle('hidden');
    if ($('#agree')) $('#agree').onclick = e => run(e.target, async () => { const st = await rpc('venture_agree_charter', { p_id: id }); if (st === 'active' && v.stage === 'chartering') toast('Everyone has agreed: the venture is live!'); });
    if ($('#cform')) $('#cform').onsubmit = e => { e.preventDefault(); run($('#cgo2'), async () => {
      const shares = {}; $$('[data-share]').forEach(i => shares[i.dataset.share] = +i.value);
      const total = Object.values(shares).reduce((a, b) => a + b, 0);
      if (Math.abs(total - 100) > 0.05) throw new Error(`Shares add up to ${total}%, not 100%`);
      await rpc('venture_save_charter', { p_id: id, p_time: $('#c_time_commitment').value, p_money: $('#c_money_commitment').value, p_decision: $('#c_decision_rule').value,
        p_leaving: $('#c_leaving_rule').value, p_ip: $('#c_ip_rule').value, p_windup: $('#c_wind_up_rule').value, p_shares: shares });
    }); };
  }

  else if (tab === 'features') {
    const feats = await sb.from('venture_features').select('*').eq('venture_id', id).order('priority').order('created_at').then(ok);
    const cols = ['idea', 'planned', 'building', 'shipped'];
    const pri = { 1: '🔴 High', 2: '🟡 Medium', 3: '⚪ Low' };
    el.innerHTML = `${!closed ? `<div class="card"><form id="ff"><div class="row"><input type="text" id="ft" class="grow" maxlength="160" placeholder="New feature" required>
        <select id="fp" style="${selStyle}"><option value="1">🔴 High</option><option value="2" selected>🟡 Medium</option><option value="3">⚪ Low</option></select>${ownerSel('fo', null, 'No owner').replace('class="sel"', `style="${selStyle}"`)}
        <button class="btn small" id="fgo">Add</button></div><textarea id="fd" maxlength="3000" placeholder="Details (optional)" style="min-height:50px;margin-top:8px"></textarea></form></div>` : ''}
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${cols.map((s, ci) => `<div class="card" style="padding:12px"><h3 style="text-transform:capitalize">${s} <span class="muted">${feats.filter(f => f.status === s).length}</span></h3>
        ${feats.filter(f => f.status === s).map(f => `<div style="background:#110e0c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px">
          <b>${esc(f.title)}</b><div class="muted" style="font-size:12px">${pri[f.priority]}${f.owner_id ? ' · ' + name(f.owner_id) : ''}</div>
          ${f.detail ? `<div style="font-size:13px;white-space:pre-wrap;margin-top:4px">${esc(f.detail)}</div>` : ''}
          ${!closed ? `<div class="row" style="gap:4px;margin-top:6px">${ci > 0 ? `<button class="btn small ghost" data-fmove="${f.id}" data-to="${cols[ci - 1]}">←</button>` : ''}${ci < 3 ? `<button class="btn small ghost" data-fmove="${f.id}" data-to="${cols[ci + 1]}">→</button>` : ''}
            <button class="btn small ghost" data-fdel="${f.id}" title="Delete">✕</button></div>` : ''}</div>`).join('') || '<p class="muted" style="font-size:13px">—</p>'}</div>`).join('')}</div>`;
    if ($('#ff')) $('#ff').onsubmit = e => { e.preventDefault(); run($('#fgo'), async () => ok(await sb.from('venture_features').insert({ venture_id: id, title: $('#ft').value.trim(), detail: $('#fd').value, priority: +$('#fp').value, owner_id: $('#fo').value || null, created_by: me.id }))); };
    $$('[data-fmove]').forEach(b => b.onclick = () => run(b, async () => ok(await sb.from('venture_features').update({ status: b.dataset.to }).eq('id', b.dataset.fmove))));
    $$('[data-fdel]').forEach(b => b.onclick = () => run(b, async () => ok(await sb.from('venture_features').delete().eq('id', b.dataset.fdel))));
  }

  else if (tab === 'tasks') {
    const [tasks, feats] = await Promise.all([
      sb.from('venture_tasks').select('*').eq('venture_id', id).order('due_on', { nullsFirst: false }).order('created_at').then(ok),
      sb.from('venture_features').select('id,title').eq('venture_id', id).neq('status', 'shipped').then(ok),
    ]);
    const cols = [['todo', 'To do'], ['doing', 'Doing'], ['done', 'Done']];
    el.innerHTML = `${!closed ? `<div class="card"><form id="tf" class="row"><input type="text" id="tt" class="grow" maxlength="200" placeholder="New task" required>
        ${ownerSel('to', me.id, 'No owner').replace('class="sel"', `style="${selStyle}"`)}<input type="date" id="td" style="width:160px">
        ${feats.length ? `<select id="tfe" style="${selStyle}"><option value="">No feature</option>${feats.map(f => `<option value="${f.id}">${esc(f.title)}</option>`).join('')}</select>` : ''}
        <button class="btn small" id="tgo">Add</button></form></div>` : ''}
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${cols.map(([s, l], ci) => `<div class="card" style="padding:12px"><h3>${l} <span class="muted">${tasks.filter(t => t.status === s).length}</span></h3>
        ${tasks.filter(t => t.status === s).map(t => { const late = t.due_on && t.status !== 'done' && t.due_on < todayISO();
          return `<div style="background:#110e0c;border:1px solid ${late ? 'var(--red)' : 'var(--line)'};border-radius:8px;padding:8px 10px;margin-bottom:8px">
          <b>${esc(t.title)}</b><div class="muted" style="font-size:12px">${t.owner_id ? name(t.owner_id) : 'unassigned'}${t.due_on ? ` · due ${dayMonth(t.due_on)}${late ? ' (late)' : ''}` : ''}</div>
          ${!closed ? `<div class="row" style="gap:4px;margin-top:6px">${ci > 0 ? `<button class="btn small ghost" data-tmove="${t.id}" data-to="${cols[ci - 1][0]}">←</button>` : ''}${ci < 2 ? `<button class="btn small ghost" data-tmove="${t.id}" data-to="${cols[ci + 1][0]}">→</button>` : ''}
            ${t.owner_id !== me.id ? `<button class="btn small ghost" data-tmine="${t.id}">Mine</button>` : ''}<button class="btn small ghost" data-tdel="${t.id}" title="Delete">✕</button></div>` : ''}</div>`; }).join('') || '<p class="muted" style="font-size:13px">—</p>'}</div>`).join('')}</div>`;
    if ($('#tf')) $('#tf').onsubmit = e => { e.preventDefault(); run($('#tgo'), async () => ok(await sb.from('venture_tasks').insert({ venture_id: id, title: $('#tt').value.trim(), owner_id: $('#to').value || null, due_on: $('#td').value || null, feature_id: $('#tfe')?.value || null, created_by: me.id }))); };
    $$('[data-tmove]').forEach(b => b.onclick = () => run(b, async () => ok(await sb.from('venture_tasks').update({ status: b.dataset.to }).eq('id', b.dataset.tmove))));
    $$('[data-tmine]').forEach(b => b.onclick = () => run(b, async () => ok(await sb.from('venture_tasks').update({ owner_id: me.id }).eq('id', b.dataset.tmine))));
    $$('[data-tdel]').forEach(b => b.onclick = () => run(b, async () => ok(await sb.from('venture_tasks').delete().eq('id', b.dataset.tdel))));
  }

  else if (tab === 'money') {
    const rows = await sb.from('venture_money').select('*').eq('venture_id', id).order('occurred_on', { ascending: false }).order('created_at', { ascending: false }).then(ok);
    const sum = (k, f = () => true) => rows.filter(x => x.kind === k && f(x)).reduce((a, x) => a + Number(x.amount), 0);
    const profit = sum('revenue') - sum('expense');
    const pot = sum('contribution') - sum('expense', x => !x.member_id) + sum('revenue', x => !x.member_id) - sum('payout');
    const kinds = { contribution: '💷 Put in', expense: '🧾 Spent', revenue: '💰 Earned', payout: '↩️ Paid out' };
    el.innerHTML = `<div class="grid">
      <div class="card"><h2>Totals</h2><table>
        <tr><td>Put in by members</td><td><b>${money_(sum('contribution'))}</b></td></tr>

        <tr><td>In the venture's pot</td><td><b>${money_(pot)}</b></td></tr></table></div>
      <div class="card"><h2>Per member</h2><table><tr><th>Name</th><th>Share</th><th>Put in</th><th>Taken out</th><th>Profit share</th></tr>
        ${members.map(m => { const u = m.user_id;
          const putIn = sum('contribution', x => x.member_id === u) + sum('expense', x => x.member_id === u);
          const out = sum('payout', x => x.member_id === u) + sum('revenue', x => x.member_id === u);
          return `<tr><td>${name(u)}</td><td>${Number(m.share_pct)}%</td><td>${money_(putIn)}</td><td>${money_(out)}</td><td>${money_(profit * Number(m.share_pct) / 100)}</td></tr>`; }).join('')}</table>
        <p class="muted" style="font-size:13px">"Put in" includes expenses someone paid from their own pocket. "Taken out" includes revenue someone received personally. Settling up isn't automatic yet; Splitwise will handle that later.</p></div></div>
      ${!closed ? `<div class="card"><h2>Record money</h2><form id="mf"><div class="row">
        <select id="mk" style="${selStyle}">${Object.entries(kinds).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>
        <span>£</span><input type="number" id="ma" min="0.01" step="0.01" required style="width:120px">
        <select id="mm" style="${selStyle}"><option value="">The venture's pot</option>${members.map(m => `<option value="${m.user_id}" ${m.user_id === me.id ? 'selected' : ''}>${name(m.user_id)}</option>`).join('')}</select>
        <input type="date" id="md2" value="${todayISO()}" style="width:160px"></div>
        <input type="text" id="mn" maxlength="500" placeholder="What for, e.g. Domain + first stock order" style="margin-top:8px">
        <p class="muted" style="font-size:13px;margin:6px 0 0">Who: for "put in" and "paid out", the member involved. For "spent", who paid (or the pot). For "earned", who received it (or the pot).</p>
        <button class="btn small" id="mgo2" style="margin-top:10px">Record</button></form></div>` : ''}
      <div class="card"><h2>Ledger</h2>${rows.length ? `<table><tr><th>Date</th><th>What</th><th>Amount</th><th>Who</th><th>Note</th><th></th></tr>${rows.map(x => `<tr><td style="white-space:nowrap">${dayMonth(x.occurred_on)} ${x.occurred_on.slice(0, 4)}</td><td>${kinds[x.kind]}</td><td>${money_(x.amount)}</td>
        <td>${x.member_id ? name(x.member_id) : '<span class="muted">pot</span>'}</td><td>${esc(x.note)}<br><span class="muted" style="font-size:12px">added by ${name(x.created_by)}</span></td>
        <td>${!closed && (x.created_by === me.id || me.is_admin) ? `<button class="btn small ghost" data-mdel="${x.id}">✕</button>` : ''}</td></tr>`).join('')}</table>` : '<p class="muted">Nothing recorded yet.</p>'}</div>`;
    if ($('#mf')) $('#mf').onsubmit = e => { e.preventDefault(); run($('#mgo2'), async () => {
      const kind = $('#mk').value, mem = $('#mm').value || null;
      if (!mem && ['contribution', 'payout'].includes(kind)) throw new Error('Pick which member put the money in or got paid out');
      ok(await sb.from('venture_money').insert({ venture_id: id, kind, amount: +$('#ma').value, member_id: mem, occurred_on: $('#md2').value, note: $('#mn').value, created_by: me.id }));
    }); };
    $$('[data-mdel]').forEach(b => b.onclick = () => {
      if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = 'Sure?'; return; }
      run(b, async () => ok(await sb.from('venture_money').delete().eq('id', b.dataset.mdel)));
    });
  }

  else if (tab === 'decisions') {
    const rows = await sb.from('venture_decisions').select('*').eq('venture_id', id).order('decided_on', { ascending: false }).then(ok);
    el.innerHTML = `${!closed ? `<div class="card"><h2>Record a decision</h2><form id="df"><div class="row"><input type="text" id="dt" class="grow" maxlength="200" placeholder="What was decided" required><input type="date" id="dd" value="${todayISO()}" style="width:160px"></div>
      <textarea id="dx" maxlength="3000" placeholder="Why, who agreed, anything to remember" style="min-height:60px;margin-top:8px"></textarea><button class="btn small" id="dgo" style="margin-top:8px">Record</button></form></div>` : ''}
      <div class="card">${rows.length ? rows.map(d => `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row"><b class="grow">${esc(d.title)}</b><span class="muted">${fmtD(d.decided_on)}</span>
        ${!closed ? `<button class="btn small ghost" data-ddel="${d.id}">✕</button>` : ''}</div>${d.detail ? `<div style="white-space:pre-wrap;margin-top:4px">${esc(d.detail)}</div>` : ''}<div class="muted" style="font-size:12px">recorded by ${name(d.created_by)}</div></div>`).join('') : '<p class="muted" style="margin:0">No decisions recorded yet. This is the tab that settles arguments.</p>'}</div>`;
    if ($('#df')) $('#df').onsubmit = e => { e.preventDefault(); run($('#dgo'), async () => ok(await sb.from('venture_decisions').insert({ venture_id: id, title: $('#dt').value.trim(), decided_on: $('#dd').value, detail: $('#dx').value, created_by: me.id }))); };
    $$('[data-ddel]').forEach(b => b.onclick = () => {
      if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = 'Sure?'; return; }
      run(b, async () => ok(await sb.from('venture_decisions').delete().eq('id', b.dataset.ddel)));
    });
  }

  else if (tab === 'updates') {
    const rows = await sb.from('venture_updates').select('*').eq('venture_id', id).order('created_at', { ascending: false }).limit(50).then(ok);
    el.innerHTML = `${!closed ? `<div class="card"><h2>Weekly check-in</h2><form id="uf">
      <label for="ud">What I did</label><textarea id="ud" maxlength="2000" style="min-height:60px"></textarea>
      <label for="un">What I'm doing next</label><textarea id="un" maxlength="2000" style="min-height:60px"></textarea>
      <label for="ub">Anything blocking me</label><textarea id="ub" maxlength="2000" style="min-height:50px"></textarea>
      <button class="btn small" id="ugo" style="margin-top:8px">Post update</button></form></div>` : ''}
      ${rows.map(u => `<div class="card"><div class="row"><b class="grow">${name(u.user_id)}</b><span class="muted">${new Date(u.created_at).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}</span>
        ${u.user_id === me.id ? `<button class="btn small ghost" data-udel="${u.id}">✕</button>` : ''}</div>
        ${u.did ? `<h3 style="margin-top:8px">Did</h3><div class="notes">${esc(u.did)}</div>` : ''}${u.next ? `<h3 style="margin-top:8px">Next</h3><div class="notes">${esc(u.next)}</div>` : ''}
        ${u.blockers ? `<h3 style="margin-top:8px">Blocked by</h3><div class="notes" style="border-color:var(--red)">${esc(u.blockers)}</div>` : ''}</div>`).join('') || '<div class="card empty">No updates yet.</div>'}`;
    if ($('#uf')) $('#uf').onsubmit = e => { e.preventDefault(); run($('#ugo'), async () => {
      if (!$('#ud').value.trim() && !$('#un').value.trim() && !$('#ub').value.trim()) throw new Error('Write something first');
      ok(await sb.from('venture_updates').insert({ venture_id: id, user_id: me.id, created_by: me.id, did: $('#ud').value, next: $('#un').value, blockers: $('#ub').value }));
    }); };
    $$('[data-udel]').forEach(b => b.onclick = () => run(b, async () => ok(await sb.from('venture_updates').delete().eq('id', b.dataset.udel))));
  }

  else if (tab === 'links') {
    const rows = await sb.from('venture_links').select('*').eq('venture_id', id).order('created_at').then(ok);
    el.innerHTML = `<div class="card">${rows.length ? `<table>${rows.map(l => `<tr><td><a href="${esc(l.url)}" target="_blank" rel="noopener" style="color:var(--gold2)">${esc(l.label)} ↗</a></td><td class="muted" style="font-size:13px;word-break:break-all">${esc(l.url)}</td>
      <td>${!closed ? `<button class="btn small ghost" data-ldel="${l.id}">✕</button>` : ''}</td></tr>`).join('')}</table>` : '<p class="muted" style="margin-top:0">Docs, repos, shop admin, shared drives: keep them all here.</p>'}
      ${!closed ? `<form id="lf" class="row" style="margin-top:12px"><input type="text" id="ll" maxlength="120" placeholder="Label" required style="max-width:220px"><input type="text" id="lu" class="grow" placeholder="https://…" required><button class="btn small" id="lgo">Add</button></form>` : ''}</div>`;
    if ($('#lf')) $('#lf').onsubmit = e => { e.preventDefault(); run($('#lgo'), async () => {
      const url = $('#lu').value.trim(); if (!/^https?:\/\//.test(url)) throw new Error('Link should start with https://');
      ok(await sb.from('venture_links').insert({ venture_id: id, label: $('#ll').value.trim(), url, created_by: me.id }));
    }); };
    $$('[data-ldel]').forEach(b => b.onclick = () => run(b, async () => ok(await sb.from('venture_links').delete().eq('id', b.dataset.ldel))));
  }

  else if (tab === 'proposal') {
    el.innerHTML = `<div class="card"><p class="muted" style="margin-top:0">The original proposal by ${name(v.created_by)}, launched ${v.launched_at ? new Date(v.launched_at).toLocaleDateString('en-GB') : ''}.</p>
      ${v.summary ? `<div class="notes">${esc(v.summary)}</div>` : ''}
      ${PROPOSAL_FIELDS.filter(([k]) => v[k]).map(([k, l]) => `<h3 style="margin-top:12px">${l}</h3><div class="notes">${esc(v[k])}</div>`).join('')}</div>`;
  }
}
const money_ = n => '£' + Number(n || 0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// ---------- gallery ----------
let galKind = 'all';
async function pageGallery() {
  const rows = await rpc('gallery_all');
  const kinds = [['all', 'Everything'], ['santa', '🎅 Secret Santa'], ['meetup', '🎲 Meetups'], ['gift', '🎁 Birthdays']];
  const shown = rows.filter(r => galKind === 'all' || r.kind === galKind);
  const years = [...new Set(shown.map(r => r.year))].sort((a, b) => b - a);
  app.innerHTML = `<h1>Gallery</h1>
    <div class="tabs2">${kinds.map(([k, l]) => `<button class="btn small ${k === galKind ? '' : 'ghost'}" data-gk="${k}">${l} <span style="opacity:.7">${k === 'all' ? rows.length : rows.filter(r => r.kind === k).length}</span></button>`).join('')}</div>
    ${!shown.length ? `<div class="card empty">Nothing here yet. Photos appear when Secret Santa years are revealed, meetup photos are uploaded, and birthday presents are handed over.</div>` :
      years.map(y => `<div class="year-h">${y}</div><div class="gallery">${shown.filter(r => r.year === y).map((r, i) => `
        <div class="mini" data-i="${rows.indexOf(r)}"><img loading="lazy" src="${photoUrl(r.photo_path)}" alt="${esc(r.title)}">
        <div><b>${esc(r.title)}</b><span class="muted">${{ santa: '🎅', meetup: '🎲', gift: '🎁' }[r.kind]} ${esc(r.subtitle)}</span></div></div>`).join('')}</div>`).join('')}`;
  $$('[data-gk]').forEach(b => b.onclick = () => { galKind = b.dataset.gk; pageGallery(); });
  $$('.mini[data-i]').forEach(el => el.onclick = () => {
    const r = rows[+el.dataset.i];
    const lb = document.createElement('div'); lb.className = 'lightbox';
    lb.innerHTML = `<img src="${photoUrl(r.photo_path)}" alt=""><p><b>${esc(r.title)}</b><br><span class="muted">${esc(r.subtitle)} · ${r.year}</span></p><a class="btn small ghost" href="${r.link}">Open</a>`;
    lb.onclick = e => { if (e.target.tagName !== 'A') lb.remove(); else lb.remove(); };
    document.body.appendChild(lb);
  });
}

// ---------- admin ----------
async function pageAdmin() {
  if (!me.is_admin) { location.hash = 'home'; return; }
  const [people, invites, draws] = await Promise.all([
    sb.from('profiles').select('id,display_name,santa_active,is_admin').order('created_at').then(ok),
    rpc('admin_list_invites'), rpc('ss_progress'),
  ]);
  const hasThisYear = draws.some(d => d.year === THIS_YEAR);
  app.innerHTML = `<h1>Admin</h1>
  <div class="card"><h2>Invite someone</h2>
    <p class="muted" style="margin-top:0">Creates a one-off link that's valid for 14 days. Add their email and we'll send it to them; otherwise copy the link and send it privately. Whoever opens it can create an account.</p>
    <div class="row"><input type="text" id="invname" class="grow" placeholder="Their name (optional)" maxlength="40"><input type="email" id="invemail" class="grow" placeholder="Their email (optional)"><button class="btn small" id="invgo">Create invite</button></div>
    <div id="invout"></div>
    ${invites.length ? `<h3 style="margin-top:18px">Unused links</h3><table>${invites.map(i => `<tr><td>${i.kind === 'join' ? 'Invite' : 'Password reset'}${i.display_name || i.target ? ': ' + esc(i.display_name || i.target) : ''}</td>
      <td class="muted">expires ${new Date(i.expires_at).toLocaleDateString('en-GB')}</td>
      <td style="text-align:right"><button class="btn small ghost" data-copy="${inviteLink(i.kind === 'join' ? 'invite' : 'reset', i.token)}">Copy link</button>
      <button class="btn small danger" data-revoke="${i.token}">Cancel</button></td></tr>`).join('')}</table>` : ''}
  </div>
  <div class="card"><h2>Members</h2><table><tr><th>Name</th><th>Secret Santa</th><th></th></tr>
    ${people.map(p => `<tr><td>${esc(p.display_name)}${p.is_admin ? ' <span class="pill gold">admin</span>' : ''}</td>
      <td><button class="btn small ${p.santa_active ? '' : 'ghost'}" data-active="${p.id}" data-to="${!p.santa_active}">${p.santa_active ? 'In' : 'Sitting out'}</button></td>
      <td style="text-align:right"><button class="btn small ghost" data-reset="${p.id}">Password reset link</button></td></tr>`).join('')}</table></div>
  <div class="card"><h2>Secret Santa draw</h2>
    <p class="muted" style="margin-top:0">Runs on the server, and nobody (including you) sees the full list. With N people, nobody repeats a person within N−1 years. It also avoids two people simply swapping where it can.</p>
    <div class="row"><input type="number" id="dyear" value="${hasThisYear ? THIS_YEAR + 1 : THIS_YEAR}" style="width:110px">
      <button class="btn small" id="drawgo">Draw ${people.filter(p => p.santa_active).length} people</button></div>
    <div id="drawres"></div>
    ${draws.length ? `<table style="margin-top:12px">${draws.map(d => `<tr><td>${d.year}</td><td>${d.finished} / ${d.people} finished</td><td style="text-align:right">
      <button class="btn small ${d.revealed ? 'ghost' : ''}" data-reveal="${d.year}" data-to="${!d.revealed}">${d.revealed ? 'Hide gallery' : 'Reveal gallery'}</button>
      ${d.finished === 0 ? `<button class="btn small danger" data-del="${d.year}">Delete draw</button>` : ''}</td></tr>`).join('')}</table>` : ''}
  </div>`;
  const showLink = (label, url) => { $('#invout').innerHTML = `<p>${label}</p><div class="linkbox">${esc(url)}</div><button class="btn small" style="margin-top:8px" id="cp">Copy</button>`; $('#cp').onclick = () => copy(url); $('#invout').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
  $('#invgo').onclick = e => busy(e.target, async () => {
    const email = $('#invemail').value.trim();
    if (email) {
      const r = await invite({ action: 'invite', email, display_name: $('#invname').value }, 'email');
      await pageAdmin(); showLink(`Invite emailed to ${esc(email)}. The link, in case it ends up in spam:`, inviteLink('invite', r.token));
    } else {
      const t = await rpc('admin_create_invite', { p_kind: 'join', p_display_name: $('#invname').value, p_user: null });
      await pageAdmin(); showLink('Invite link created. Send it privately:', inviteLink('invite', t));
    }
  });
  $$('[data-copy]').forEach(b => b.onclick = () => copy(b.dataset.copy));
  $$('[data-revoke]').forEach(b => b.onclick = () => busy(b, async () => { await rpc('admin_revoke_invite', { p_token: b.dataset.revoke }); pageAdmin(); }));
  $$('[data-reset]').forEach(b => b.onclick = () => busy(b, async () => {
    const t = await rpc('admin_create_invite', { p_kind: 'reset', p_display_name: null, p_user: b.dataset.reset });
    await pageAdmin(); showLink('Password reset link created. Send it to them privately:', inviteLink('reset', t));
  }));
  $$('[data-active]').forEach(b => b.onclick = () => busy(b, async () => { await rpc('admin_set_santa_active', { p_user: b.dataset.active, p_active: b.dataset.to === 'true' }); pageAdmin(); }));
  $$('[data-reveal]').forEach(b => b.onclick = () => busy(b, async () => { await rpc('ss_set_revealed', { p_year: +b.dataset.reveal, p_revealed: b.dataset.to === 'true' }); pageAdmin(); }));
  $$('[data-del]').forEach(b => b.onclick = () => {
    if (b.dataset.armed) return busy(b, async () => { await rpc('ss_delete_draw', { p_year: +b.dataset.del }); pageAdmin(); });
    b.dataset.armed = 1; b.textContent = 'Click again to delete';
  });
  $('#drawgo').onclick = e => busy(e.target, async () => {
    const r = await rpc('ss_run_draw', { p_year: +$('#dyear').value });
    await pageAdmin();
    $('#drawres').innerHTML = `<p>✅ ${r.year} drawn for ${r.people} people. ${r.repeat_pairs ? `${r.repeat_pairs} pairing(s) had happened before; the most recent was ${r.shortest_gap_years} year(s) ago, and that was the best possible.` : 'Every pairing is brand new.'}</p>`;
  });
}

route();
</script>
</body>
</html>
