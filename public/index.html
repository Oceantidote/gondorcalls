<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gondor Calls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root { --bg:#14110f; --panel:#1f1a16; --panel2:#2a231d; --line:#3d332a; --gold:#d4a64a; --gold2:#f0cf85; --red:#a8322d; --text:#ece3d4; --muted:#a39684; --ok:#6fa86b; }
  * { box-sizing: border-box; }
  body { margin:0; background: radial-gradient(ellipse at top, #2a1a16 0%, var(--bg) 60%) fixed; color:var(--text); font:15px/1.5 Inter, system-ui, sans-serif; min-height:100vh; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; max-width:1000px; margin:0 auto; padding:20px 16px 8px; }
  .brand { font-family:Cinzel, serif; font-weight:800; color:var(--gold); font-size:26px; letter-spacing:.06em; text-decoration:none; text-shadow:0 2px 0 #000; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  nav a { color:var(--muted); text-decoration:none; border:1px solid var(--line); padding:6px 14px; border-radius:999px; font-weight:600; font-size:14px; }
  nav a.on { background:var(--gold); color:#1a130b; border-color:var(--gold); }
  main { max-width:1000px; margin:0 auto; padding:12px 16px 64px; }
  .card { background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; box-shadow:0 6px 24px rgba(0,0,0,.35); }
  .narrow { max-width:440px; margin:40px auto; }
  h1 { font-family:Cinzel, serif; color:var(--gold); margin:0 0 16px; font-size:28px; }
  h2 { font-family:Cinzel, serif; color:var(--gold2); margin:0 0 12px; font-size:20px; }
  h3 { margin:0 0 8px; font-size:16px; }
  label { display:block; font-weight:600; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], textarea {
    width:100%; padding:10px 12px; background:#110e0c; border:1px solid var(--line); color:var(--text); border-radius:8px; font:inherit; color-scheme:dark; }
  textarea { min-height:90px; resize:vertical; }
  input:focus, textarea:focus { outline:2px solid var(--gold); outline-offset:1px; }
  .btn { display:inline-block; margin-top:14px; background:var(--gold); color:#1a130b; border:0; padding:10px 18px; border-radius:8px; font:600 14px Inter, sans-serif; cursor:pointer; text-decoration:none; }
  .btn.ghost { background:transparent; color:var(--gold); border:1px solid var(--gold); }
  .btn.danger { background:var(--red); color:#fff; }
  .btn.small { padding:6px 12px; margin-top:0; font-size:13px; }
  .btn:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .grow { flex:1; min-width:200px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  .muted { color:var(--muted); }
  .big-name { font-family:Cinzel, serif; font-size:clamp(28px,6vw,44px); color:var(--gold); margin:4px 0 8px; }
  .notes { white-space:pre-wrap; background:#110e0c; border-left:3px solid var(--gold); padding:10px 14px; border-radius:6px; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--line); }
  .pill.ok { color:var(--ok); border-color:var(--ok); } .pill.gold { color:var(--gold); border-color:var(--gold); }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .mini { background:#110e0c; border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:zoom-in; }
  .mini img { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:#000; }
  .mini div { padding:10px 12px; } .mini b { display:block; }
  .year-h { font-family:Cinzel, serif; color:var(--gold); font-size:24px; margin:20px 0 10px; border-bottom:1px solid var(--line); }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#000; border:1px solid var(--gold); color:var(--text); padding:12px 18px; border-radius:10px; max-width:90vw; z-index:50; }
  .toast.err { border-color:var(--red); }
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); display:flex; align-items:center; justify-content:center; z-index:40; cursor:zoom-out; padding:20px; flex-direction:column; }
  .lightbox img { max-width:100%; max-height:82vh; border-radius:8px; }
  .linkbox { font-family:ui-monospace, monospace; font-size:12px; word-break:break-all; background:#110e0c; padding:10px; border-radius:6px; border:1px dashed var(--gold); }
  .preview { max-width:220px; border-radius:8px; margin-top:10px; display:block; }
  .hidden { display:none !important; }
  select { padding:10px; background:#110e0c; color:var(--text); border:1px solid var(--line); border-radius:8px; font:inherit; color-scheme:dark; max-width:100%; }
  .card { overflow-x:auto; }
  nav a { display:inline-flex; align-items:center; gap:6px; }
  .burger { display:none; background:transparent; border:1px solid var(--line); border-radius:10px; width:46px; height:42px; padding:10px; cursor:pointer; flex-direction:column; justify-content:space-between; }
  .burger span { display:block; height:2px; background:var(--gold); border-radius:2px; transition:transform .2s, opacity .2s; }
  .burger[aria-expanded=true] span:nth-child(1) { transform:translateY(9px) rotate(45deg); }
  .burger[aria-expanded=true] span:nth-child(2) { opacity:0; }
  .burger[aria-expanded=true] span:nth-child(3) { transform:translateY(-9px) rotate(-45deg); }
  @media (max-width: 760px) {
    header { padding:12px 16px 4px; flex-wrap:nowrap; position:sticky; top:0; z-index:30; background:rgba(20,17,15,.96); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
    .brand { font-size:22px; }
    .burger { display:flex; }
    nav { display:none; position:absolute; left:0; right:0; top:100%; flex-direction:column; gap:0; background:var(--panel); border-bottom:1px solid var(--line); box-shadow:0 12px 30px rgba(0,0,0,.6); max-height:calc(100vh - 70px); overflow-y:auto; padding:6px 0; }
    nav.open { display:flex; }
    nav a { border:0; border-radius:0; padding:13px 20px; font-size:16px; color:var(--text); }
    nav a.on { background:rgba(212,166,74,.15); color:var(--gold); }
    nav a + a { border-top:1px solid rgba(61,51,42,.5); }
    main { padding:12px 12px 64px; }
    .card { padding:16px; }
    h1 { font-size:24px; }
    input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], textarea, select { font-size:16px; }
    .btn.small { padding:10px 14px; min-height:40px; }
    .grow { min-width:0; flex-basis:100%; }
    td, th { padding:8px 4px; }
  }
  a.cardlink { display:block; color:inherit; text-decoration:none; transition:border-color .15s, transform .15s; }
  a.cardlink:hover, a.cardlink:focus-visible { border-color:var(--gold); transform:translateY(-2px); }
  .empty { text-align:center; padding:30px; color:var(--muted); }
  .tabs2 { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
</style>
</head>
<body>
<header id="hdr" class="hidden">
  <a class="brand" href="#home">Gondor Calls</a>
  <button id="burger" class="burger" aria-label="Menu" aria-expanded="false" aria-controls="nav"><span></span><span></span><span></span></button>
  <nav id="nav"></nav>
</header>
<main id="app"><div class="empty">Loading…</div></main>
<script>
const SITE_NAME = 'Gondor Calls';
const sb = supabase.createClient('https://vhlalqnxkasijbspyrrp.supabase.co', 'sb_publishable_g2Oe_3tlYEittwgGjF94AQ_vvhB5wDf');
const THIS_YEAR = new Date().getFullYear();
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');
let me = null;

function toast(msg, err = false) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 3000);
}
async function busy(btn, fn) { btn.disabled = true; try { await fn(); } catch (e) { toast(e.message || String(e), true); } finally { btn.disabled = false; } }
const ok = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
const rpc = async (fn, args = {}) => ok(await sb.rpc(fn, args));
const photoUrl = p => sb.storage.from('models').getPublicUrl(p).data.publicUrl;
// Everyone's name and profile picture, cached for a minute, so any page can draw an avatar.
let PEOPLE = {}, peopleAt = 0;
async function loadPeople(force = false) {
  if (!force && Date.now() - peopleAt < 60000) return;
  let r = await sb.from('profiles').select('id,display_name,avatar_path');
  if (r.error) r = await sb.from('profiles').select('id,display_name');   // before the avatar column exists
  PEOPLE = Object.fromEntries((r.data || []).map(p => [p.id, p])); peopleAt = Date.now();
}
const initials = n => String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
const hue = id => [...String(id)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
function av(uid, size = 22) {
  const p = PEOPLE[uid] || {}, n = p.display_name || '?';
  const st = `width:${size}px;height:${size}px;border-radius:50%;flex:none;vertical-align:middle;display:inline-flex;border:1px solid var(--line);`;
  return p.avatar_path ? `<img class="av" src="${photoUrl(p.avatar_path)}" alt="" title="${esc(n)}" loading="lazy" style="${st}object-fit:cover;background:#000">`
    : `<span class="av" title="${esc(n)}" style="${st}align-items:center;justify-content:center;background:hsl(${hue(uid)} 32% 30%);color:#f3e7d3;font:700 ${Math.max(9, Math.round(size * .4))}px Inter,sans-serif;letter-spacing:0">${esc(initials(n))}</span>`;
}
const who = (uid, label) => `<span style="white-space:nowrap">${av(uid, 20)} ${label ?? esc(PEOPLE[uid]?.display_name || '?')}</span>`;
// Square-crop and shrink a picture for use as an avatar.
async function squareJpeg(file, size = 400) {
  const img = await createImageBitmap(file).catch(() => null);
  if (!img) throw new Error('Could not read that image');
  const s = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.88));
}
const inviteLink = (kind, t) => `${location.origin}/#${kind}=${t}`;
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('Copied'); } catch { toast('Copy failed: select the link and copy it by hand', true); } }

async function invite(body, fn = 'invite') {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch('https://vhlalqnxkasijbspyrrp.supabase.co/functions/v1/' + fn, {
    method: 'POST', headers: { 'Content-Type': 'application/json', apikey: 'sb_publishable_g2Oe_3tlYEittwgGjF94AQ_vvhB5wDf', ...(session ? { Authorization: 'Bearer ' + session.access_token } : {}) }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong');
  return d;
}

async function shrink(file) {
  const img = await createImageBitmap(file).catch(() => null);
  if (!img) throw new Error('Could not read that image');
  const max = 1800, scale = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.88));
}
async function uploadPhoto(file, area, year) {
  const path = `${area}/${year}/${me.id}/${crypto.randomUUID()}.jpg`;
  ok(await sb.storage.from('models').upload(path, await shrink(file), { contentType: 'image/jpeg' }));
  return path;
}

function nextBirthday(d) {
  if (!d) return null;
  const [y, m, day] = d.split('-').map(Number), now = new Date(); now.setHours(0,0,0,0);
  let n = new Date(now.getFullYear(), m - 1, day); if (n < now) n = new Date(now.getFullYear() + 1, m - 1, day);
  return { date: n, days: Math.round((n - now) / 864e5) };
}
const dayMonth = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long' }) : '—';

// ---------- routing ----------
const routes = { home: pageHome, meetups: pageMeetups, meetup: pageMeetup, birthdays: pageBirthdays, gift: pageGift, ventures: pageVentures, venture: pageVenture, gallery: pageGallery, money: pageMoney, member: pageMember, games: pageGames, painting: pagePainting, fame: pageFame, members: pageMembers, santa: pageSanta, profile: pageProfile, admin: pageAdmin };
function drawNav(active) {
  const items = [['home','Home'],['meetups','Meetups'],['games','Games'],['painting','Painting'],['birthdays','Birthdays'],['santa','Secret Santa'],['money','Money'],['gallery','Gallery'],['fame','Hall of fame'],['members','Members'],['ventures','Ventures'],['profile','My profile']];
  if (me?.is_admin) items.push(['admin','Admin']);
  $('#nav').innerHTML = items.map(([k, l]) => `<a href="#${k}" class="${k === active ? 'on' : ''}">${k === 'profile' ? av(me.id, 18) + ' ' : ''}${l}</a>`).join('') + `<a href="#" id="signout">Sign out</a>`;
  $('#signout').onclick = async e => { e.preventDefault(); await sb.auth.signOut(); me = null; location.hash = ''; route(); };
  setMenu(false);
  document.title = (({ home: '', santa: 'Secret Santa', fame: 'Hall of fame', profile: 'My profile' })[active] ?? (active ? active[0].toUpperCase() + active.slice(1) : '')) + (active && active !== 'home' ? ' · ' : '') + SITE_NAME;
}
// Mobile menu
function setMenu(open) { $('#nav').classList.toggle('open', open); $('#burger').setAttribute('aria-expanded', String(open)); }
$('#burger').onclick = e => { e.stopPropagation(); setMenu(!$('#nav').classList.contains('open')); };
document.addEventListener('click', e => { if (!e.target.closest('#nav') && !e.target.closest('#burger')) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
async function route() {
  const h = location.hash.slice(1);
  const m = h.match(/^(invite|reset)=([0-9a-f-]{36})$/i);
  if (m) { $('#hdr').classList.add('hidden'); return pageRedeem(m[1], m[2]); }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { me = null; $('#hdr').classList.add('hidden'); return pageLogin(); }
  if (!me || me.id !== session.user.id) {
    const { data } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    if (!data) { await sb.auth.signOut(); toast('No member profile for this account', true); return pageLogin(); }
    me = data;
  }
  await loadPeople();
  const [base, arg, arg2] = h.split('/');
  const page = routes[base] ? base : 'home';
  $('#hdr').classList.remove('hidden'); drawNav({ meetup: 'meetups', gift: 'birthdays', venture: 'ventures', member: 'members' }[page] || page);
  app.innerHTML = '<div class="empty">Loading…</div>';
  try { await routes[page](arg, arg2); } catch (e) { app.innerHTML = `<div class="card">${esc(e.message)}</div>`; }
}
let lastBase = null;
addEventListener('hashchange', () => {
  // a new page opens at the top; re-rendering the same page (e.g. after saving) keeps your place
  const base = location.hash.slice(1).split('/').slice(0, 2).join('/');
  if (base !== lastBase) scrollTo(0, 0);
  lastBase = base; route();
});

// ---------- auth pages ----------
function pageLogin() {
  app.innerHTML = `<div class="card narrow"><h1>${SITE_NAME}</h1>
    <p class="muted" style="margin-top:0">Members only. New here? You need an invite link from the organiser.</p>
    <form id="f"><label for="em">Email</label><input type="email" id="em" autocomplete="email" required>
    <label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" required>
    <button class="btn" id="go">Sign in</button></form>
    <p class="muted" style="font-size:13px"><a href="#" id="forgot" style="color:var(--gold)">Forgotten your password?</a></p>
    <form id="ff2" class="hidden"><p class="muted" style="font-size:13px;margin:0">We'll email you a link to choose a new one.</p>
      <div class="row" style="margin-top:6px"><input type="email" id="fem" class="grow" placeholder="Your email" required><button class="btn small" id="fgo2">Send link</button></div></form></div>`;
  $('#f').onsubmit = e => { e.preventDefault(); busy($('#go'), async () => {
    ok(await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value }));
    location.hash = 'home'; route();
  }); };
  $('#forgot').onclick = e => { e.preventDefault(); $('#ff2').classList.toggle('hidden'); $('#fem').value = $('#em').value; $('#fem').focus(); };
  $('#ff2').onsubmit = e => { e.preventDefault(); busy($('#fgo2'), async () => {
    await invite({ action: 'forgot', email: $('#fem').value }, 'email');
    $('#ff2').innerHTML = '<p>If that email belongs to a member, a reset link is on its way. It lasts 2 hours. Check spam too.</p>';
  }); };
}
async function pageRedeem(kind, token) {
  app.innerHTML = '<div class="empty">Checking your link…</div>';
  let info;
  try { info = await invite({ action: 'check', token }); }
  catch (e) { app.innerHTML = `<div class="card narrow"><h2>Link problem</h2><p>${esc(e.message)}</p><a class="btn ghost" href="#">Go to sign in</a></div>`; return; }
  const join = kind === 'invite';
  app.innerHTML = `<div class="card narrow"><h1>${join ? 'Join ' + SITE_NAME : 'Set a new password'}</h1>
    <form id="f">
    ${join ? `<label for="nm">Your name (as the group knows you)</label><input type="text" id="nm" maxlength="40" value="${esc(info.display_name || '')}" required>
      <label for="em">Email (this is your login)</label><input type="email" id="em" autocomplete="email" required>`
      : `<p class="muted">For <b>${esc(info.display_name || '')}</b></p>`}
    <label for="pw">${join ? 'Choose a password' : 'New password'} (8+ characters)</label><input type="password" id="pw" minlength="8" autocomplete="new-password" required>
    <button class="btn" id="go">${join ? 'Create my account' : 'Save password'}</button></form></div>`;
  $('#f').onsubmit = e => { e.preventDefault(); busy($('#go'), async () => {
    const pw = $('#pw').value;
    const r = join ? await invite({ action: 'redeem', token, email: $('#em').value, display_name: $('#nm').value, password: pw })
                   : await invite({ action: 'reset', token, password: pw });
    ok(await sb.auth.signInWithPassword({ email: r.email, password: pw }));
    toast(join ? 'Welcome to Gondor Calls!' : 'Password updated');
    history.replaceState(null, '', location.pathname + (join ? '#profile' : '#home')); route();
  }); };
}

// ---------- home ----------
async function pageHome() {
  const [people, assignments] = await Promise.all([
    sb.from('profiles').select('id,display_name,birthday').then(ok),
    sb.from('ss_assignments').select('year, receiver_id, photo_path, completed_at').eq('giver_id', me.id).order('year', { ascending: false }).limit(1).then(ok),
  ]);
  const bdays = people.map(p => ({ ...p, nb: nextBirthday(p.birthday) })).filter(p => p.nb).sort((a, b) => a.nb.days - b.nb.days);
  const santa = assignments.find(x => x.year === THIS_YEAR || !x.completed_at);
  const nm = await nextMeetup();
  const [vdir, pairs] = await Promise.all([rpc('ventures_directory'), rpc('ledger_balances').catch(() => [])]);
  const myNet = pairs.reduce((a, p) => a + (p.creditor === me.id ? +p.amount : p.debtor === me.id ? -p.amount : 0), 0);
  const vAsk = vdir.filter(v => v.stage === 'proposal' && !v.my_response), vMine = vdir.filter(v => v.i_am_member && ['chartering', 'active'].includes(v.stage));
  const missing = people.filter(p => !p.birthday).map(p => p.display_name);
  app.innerHTML = `<h1>Hail, ${esc(me.display_name)}</h1>
  ${!me.birthday ? `<div class="card"><b>Add your birthday</b> so the group can plan your present. <a href="#profile" class="btn small" style="margin-left:8px">Edit profile</a></div>` : ''}
  <div class="grid">
    <div class="card"><h2>Upcoming birthdays</h2>
      ${bdays.length ? `<table>${bdays.slice(0, 5).map(p => `<tr><td>${who(p.id)}</td><td>${dayMonth(p.birthday)}</td><td class="muted">${p.nb.days === 0 ? '<span class="pill gold">Today!</span>' : `in ${p.nb.days} days`}</td></tr>`).join('')}</table>` : '<p class="muted">No birthdays added yet.</p>'}
      ${missing.length ? `<p class="muted" style="font-size:13px">Not added yet: ${esc(missing.join(', '))}</p>` : ''}
      <a class="btn small ghost" href="#birthdays">Gift planning</a>
    </div>
    <div class="card"><h2>Secret Santa</h2>
      ${santa ? `<p>${santa.year}: you're painting for <b>${esc(people.find(p => p.id === santa.receiver_id)?.display_name)}</b>. ${santa.photo_path ? '<span class="pill ok">Done</span>' : ''}</p>` : '<p class="muted">No draw yet this year.</p>'}
      <a class="btn small" href="#santa">Open Secret Santa</a>
    </div>
    <div class="card" id="homechal"><h2>Painting challenge</h2><p class="muted" style="margin:0">Loading…</p></div>
    <div class="card"><h2>Next meetup</h2>
      ${nm ? `<p><b>${esc(nm.title)}</b> ${statusPill(nm.status)}<br><span class="muted">${fmtRange(nm.start_date, nm.end_date)}</span></p><a class="btn small" href="#meetup/${nm.id}">Open</a>`

    </div>
    <div class="card"><h2>Ventures</h2>
      ${vAsk.length ? `<p><b>${vAsk.length} proposal${vAsk.length > 1 ? 's' : ''} waiting for your answer:</b> ${vAsk.map(v => `<a href="#venture/${v.id}" style="color:var(--gold)">${esc(v.title)}</a>`).join(', ')}</p>` : ''}
      ${vMine.length ? `<p>Yours: ${vMine.map(v => `<a href="#venture/${v.id}" style="color:var(--gold)">${esc(v.title)}</a>${v.stage === 'chartering' ? ' <span class="pill">charter</span>' : ''}`).join(', ')}</p>` : ''}
      ${!vAsk.length && !vMine.length ? '<p class="muted">Nothing needs you right now.</p>' : ''}
      <a class="btn small ghost" href="#ventures">Open ventures</a>
    </div>
    <div class="card"><h2>Money</h2>
      <p>${Math.abs(myNet) < 0.005 ? '<span class="muted">You\'re all square.</span>' : myNet > 0 ? `You're owed <b style="color:var(--ok)">${money_(myNet)}</b>` : `You owe <b style="color:#e0a070">${money_(-myNet)}</b>`}</p>
      <a class="btn small" href="#money/new">+ Add expense</a> <a class="btn small ghost" href="#money">Balances</a>
    </div>
    <div class="card"><h2>The group</h2><p>${people.length} members.</p><a class="btn small ghost" href="#members">See everyone</a></div>
  </div>`;
  loadChallenges().then(({ chals, entries, cur }) => {
    const c = chals.find(x => x.month === cur), e = entries.find(x => x.month === cur && x.user_id === me.id);
    const owed = roundsOwed(chals, entries, cur).filter(o => o.user_id === me.id).length;
    const left = Math.round((lastDay(cur) - new Date(londonToday() + 'T00:00:00')) / 864e5) + 1;
    $('#homechal').innerHTML = `<h2>${new Date(cur + 'T00:00:00').toLocaleDateString('en-GB', { month: 'long' })} challenge</h2>
      ${c?.theme ? `<p style="font-size:18px;margin:0 0 6px"><b>${esc(c.theme)}</b></p>
        <p style="margin:0">${e?.finished_at ? '<span style="color:var(--ok)">✅ You\'re done.</span>' : e?.opted_out ? '<span class="muted">You\'re sitting this one out.</span>' : `⏳ ${left} day${left === 1 ? '' : 's'} left to upload yours.`}</p>`
        : `<p style="margin:0">${c?.setter === me.id ? '<b>It\'s your turn to pick the theme.</b>' : `Waiting for ${who(c?.setter)} to pick.`}</p>`}
      ${owed ? `<p style="margin:8px 0 0;color:#e0a070">🍺 You owe ${owed} round${owed === 1 ? '' : 's'}.</p>` : ''}
      <a class="btn small${c?.theme && !e?.finished_at ? '' : ' ghost'}" href="#painting">Open painting</a>`;
  }).catch(() => $('#homechal').remove());
}

  if (!m) { app.innerHTML = '<div class="card">Meetup not found.</div>'; return; }
  const [people, opts, venues, rsvps, items, photos] = await Promise.all([
    sb.from('profiles').select('id,display_name').order('display_name').then(ok),
    sb.from('meetup_date_options').select('*').eq('meetup_id', id).order('start_date').then(ok),
    sb.from('meetup_venues').select('*').eq('meetup_id', id).order('created_at').then(ok),
    sb.from('meetup_rsvps').select('*').eq('meetup_id', id).then(ok),
    sb.from('meetup_items').select('*').eq('meetup_id', id).order('created_at').then(ok),

  const going = rsvps.filter(r => r.status === 'going');

  </div>

  <div class="card"><h2>Where?</h2>
    ${venues.length ? `<div class="grid">${venues.map(v => { const vs = vvotes.filter(x => x.venue_id === v.id), mine = vs.some(x => x.user_id === me.id), chosen = v.id === m.venue_id;
      const heads = Math.max(going.length, 1);
      return `<div class="card" style="margin:0;${chosen ? 'border-color:var(--gold)' : ''}">
        <div class="row"><h3 class="grow" style="margin:0">${v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener" style="color:var(--gold2)">${esc(v.name)} ↗</a>` : esc(v.name)}</h3>${chosen ? '<span class="pill gold">chosen</span>' : ''}</div>
        <p class="muted" style="margin:6px 0">${v.total_price != null ? `${money(v.total_price)} total · <b style="color:var(--text)">${money(v.total_price / heads)} each</b> for ${heads} going` : 'No price yet'}${v.sleeps ? ` · sleeps ${v.sleeps}` : ''}</p>
        ${v.notes ? `<div class="notes" style="font-size:14px">${esc(v.notes)}</div>` : ''}
        <p style="margin:10px 0 0">👍 ${vs.length}${vs.length ? ': ' + vs.map(x => who(x.user_id)).join(' ') : ''}</p>
        <div class="row" style="margin-top:10px"><button class="btn small ${mine ? '' : 'ghost'}" data-vv="${v.id}" data-on="${mine}">${mine ? 'Voted' : 'Vote'}</button>
          ${manager && !chosen ? `<button class="btn small" data-choose="${v.id}">Choose</button>` : ''}
          ${manager || v.added_by === me.id ? `<button class="btn small ghost" data-delv="${v.id}">Remove</button>` : ''}</div></div>`; }).join('')}</div>` : '<p class="muted" style="margin-top:0">No places suggested yet.</p>'}
    <details style="margin-top:14px"><summary class="btn small ghost" style="list-style:none">+ Suggest a place</summary>
      <form id="vf"><label for="vn">Name</label><input type="text" id="vn" maxlength="120" required placeholder="e.g. The Old Barn, Snowdonia">
        <label for="vu">Link (Airbnb, Vrbo, cottage site…)</label><input type="text" id="vu" placeholder="https://…">
        <div class="row"><div><label for="vp">Total price £</label><input type="number" id="vp" min="0" step="0.01"></div><div><label for="vs">Sleeps</label><input type="number" id="vs" min="1"></div></div>
        <label for="vno">Notes</label><textarea id="vno" maxlength="1000" placeholder="Big table for gaming? Parking? Pub nearby?"></textarea>
        <button class="btn" id="vgo">Add place</button></form></details>
  </div>

  <div class="card"><h2>Who's bringing what</h2>
    ${items.length ? `<table>${items.map(i => `<tr><td>${esc(i.label)}</td><td>${i.claimed_by ? `<b>${who(i.claimed_by)}</b>` : '<span class="muted">nobody yet</span>'}</td>
      <td style="text-align:right;white-space:nowrap">${!i.claimed_by ? `<button class="btn small" data-claim="${i.id}">I'll bring it</button>` : i.claimed_by === me.id ? `<button class="btn small ghost" data-unclaim="${i.id}">Unclaim</button>` : ''}
      ${manager || i.added_by === me.id ? `<button class="btn small ghost" data-deli="${i.id}" title="Remove">✕</button>` : ''}</td></tr>`).join('')}</table>` : '<p class="muted" style="margin-top:0">Nothing on the list yet: terrain, armies, dice towers, snacks, projector…</p>'}
    <form id="itf" class="row" style="margin-top:12px"><input type="text" id="itl" class="grow" maxlength="120" placeholder="Add something that needs bringing" required><button class="btn small" id="itgo">Add</button></form>
  </div>

  ${m.status !== 'cancelled' && (!m.end_date || m.end_date >= todayISO()) ? '<div class="card" id="rounds"></div>' : ''}
  <div class="card" id="costs"><h2>Costs</h2><p class="muted">Loading…</p></div>
  ${m.start_date && m.start_date <= todayISO() && m.status !== 'cancelled' ? `<div class="card" id="awards"></div>
  <div class="card"><div class="row"><h2 class="grow" style="margin:0">Games played here</h2><a class="btn small" href="#games/new/${m.id}">+ Log a game</a></div><p class="muted" style="margin:8px 0 0">Results go into the <a href="#games" style="color:var(--gold)">league</a>.</p></div>` : ''}

  <div class="card"><h2>Photos</h2>
    ${photos.length ? `<div class="gallery">${photos.map(p => `<div class="mini" data-src="${photoUrl(p.path)}" data-cap="${esc(p.caption)}">
      <img loading="lazy" src="${photoUrl(p.path)}" alt="${esc(p.caption)}"><div><b>${esc(p.caption || ' ')}</b><span class="muted">${who(p.user_id)}</span>
      ${p.user_id === me.id || manager ? ` · <a href="#" data-delp="${p.id}" style="color:var(--muted)">remove</a>` : ''}</div></div>`).join('')}</div>` : '<p class="muted" style="margin-top:0">No photos yet. Add battle shots and the obligatory group photo afterwards.</p>'}
    <form id="phf" class="row" style="margin-top:12px"><input type="file" id="phi" accept="image/*" multiple required><input type="text" id="phc" class="grow" maxlength="200" placeholder="Caption (optional)"><button class="btn small" id="phgo">Upload</button></form>
  </div>`;

  costsCard($('#costs'), 'meetup', id, people).catch(e => $('#costs').innerHTML = `<p class="muted">${esc(e.message)}</p>`);
  if ($('#rounds')) loadChallenges().then(({ chals, entries, cur }) => { const o = roundsOwed(chals, entries, cur);
    if (!o.length) { $('#rounds').remove(); return; }
    $('#rounds').innerHTML = `<h2>🍺 Rounds owed</h2><p class="muted" style="margin-top:0;font-size:13px">Missed painting challenges. Collect at this meetup.</p>${roundsOwedHtml(o)}`;
    wireRounds($('#rounds'), () => pageMeetup(id)); }).catch(() => $('#rounds').remove());
  if ($('#awards')) awardsCard($('#awards'), m).catch(e => $('#awards').innerHTML = `<p class="muted">${esc(e.message)}</p>`);
  const reload = () => pageMeetup(id);
  const run = (el, fn) => busy(el, async () => { await fn(); await reload(); });
  if (manager) {
    $('#edit').onclick = () => $('#ef').classList.toggle('hidden');
    $('#ef').onsubmit = e => { e.preventDefault(); run($('#esave'), async () => ok(await sb.from('meetups').update({
      title: $('#et').value.trim(), description: $('#ed').value, details: $('#edt').value, status: $('#est').value,
      start_date: $('#es').value || null, end_date: $('#ee').value || $('#es').value || null }).eq('id', id))); };
    $('#edel').onclick = e => {
      if (!e.target.dataset.armed) { e.target.dataset.armed = 1; e.target.textContent = 'Click again to delete for everyone'; return; }
      busy(e.target, async () => { ok(await sb.from('meetups').delete().eq('id', id)); location.hash = 'meetups'; });
    };
  }
  $$('[data-rsvp]').forEach(b => b.onclick = () => run(b, async () => ok(await sb.from('meetup_rsvps').upsert({ meetup_id: id, user_id: me.id, status: b.dataset.rsvp }))));
  $$('[data-vote]').forEach(b => b.onclick = () => run(b, async () => {
    const a = next[b.dataset.cur || undefined];
    ok(a ? await sb.from('meetup_date_votes').upsert({ option_id: b.dataset.vote, user_id: me.id, answer: a })
         : await sb.from('meetup_date_votes').delete().eq('option_id', b.dataset.vote).eq('user_id', me.id));
  }));
  $$('[data-pick]').forEach(b => b.onclick = () => run(b, async () => { const o = opts.find(x => x.id === b.dataset.pick);
    ok(await sb.from('meetups').update({ start_date: o.start_date, end_date: o.end_date }).eq('id', id)); }));
  $$('[data-delopt]').forEach(b => b.onclick = () => run(b, async () => ok(await sb.from('meetup_date_options').delete().eq('id', b.dataset.delopt))));
  $('#of').onsubmit = e => { e.preventDefault(); run($('#ogo'), async () => {
    const s = $('#os').value, en = $('#oe').value || s; if (en < s) throw new Error('End date is before the start');
    ok(await sb.from('meetup_date_options').insert({ meetup_id: id, start_date: s, end_date: en, added_by: me.id }));
    await sb.from('meetup_date_votes').upsert({ option_id: (await sb.from('meetup_date_options').select('id').eq('meetup_id', id).eq('start_date', s).eq('end_date', en).single().then(ok)).id, user_id: me.id, answer: 'yes' });
  }); };
  $$('[data-vv]').forEach(b => b.onclick = () => run(b, async () => ok(b.dataset.on === 'true'
    ? await sb.from('meetup_venue_votes').delete().eq('venue_id', b.dataset.vv).eq('user_id', me.id)
    : await sb.from('meetup_venue_votes').insert({ venue_id: b.dataset.vv, user_id: me.id }))));
  $$('[data-choose]').forEach(b => b.onclick = () => run(b, async () => ok(await sb.from('meetups').update({ venue_id: b.dataset.choose }).eq('id', id))));
  $$('[data-delv]').forEach(b => b.onclick = () => run(b, async () => ok(await sb.from('meetup_venues').delete().eq('id', b.dataset.delv))));
  $('#vf').onsubmit = e => { e.preventDefault(); run($('#vgo'), async () => {
    const url = $('#vu').value.trim();
    if (url && !/^https?:\/\//.test(url)) throw new Error('Link should start with https://');
    ok(await sb.from('meetup_venues').insert({ meetup_id: id, name: $('#vn').value.trim(), url: url || null,
      total_price: $('#vp').value === '' ? null : +$('#vp').value, sleeps: $('#vs').value === '' ? null : +$('#vs').value, notes: $('#vno').value, added_by: me.id }));
  }); };
  $$('[data-claim]').forEach(b => b.onclick = () => run(b, async () => ok(await sb.from('meetup_items').update({ claimed_by: me.id }).eq('id', b.dataset.claim))));
  $$('[data-unclaim]').forEach(b => b.onclick = () => run(b, async () => ok(await sb.from('meetup_items').update({ claimed_by: null }).eq('id', b.dataset.unclaim))));
  $$('[data-deli]').forEach(b => b.onclick = () => run(b, async () => ok(await sb.from('meetup_items').delete().eq('id', b.dataset.deli))));
  $('#itf').onsubmit = e => { e.preventDefault(); run($('#itgo'), async () => ok(await sb.from('meetup_items').insert({ meetup_id: id, label: $('#itl').value.trim(), added_by: me.id }))); };
  $$('.mini').forEach(el => el.onclick = ev => { if (ev.target.dataset.delp) return; lightbox(el.dataset.src, el.dataset.cap); });
  $$('[data-delp]').forEach(a => a.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); run(a, async () => ok(await sb.from('meetup_photos').delete().eq('id', a.dataset.delp))); });
  $('#phf').onsubmit = e => { e.preventDefault(); run($('#phgo'), async () => {
    const yr = (m.start_date || todayISO()).slice(0, 4);
    for (const f of $('#phi').files) {
      const path = await uploadPhoto(f, 'meetups', yr);
      ok(await sb.from('meetup_photos').insert({ meetup_id: id, path, caption: $('#phc').value.trim(), user_id: me.id }));
    }
  }); };
}

// ---------- birthdays ----------
const giftPill = s => ({ planning: '<span class="pill">Planning</span>', bought: '<span class="pill gold">Bought</span>', given: '<span class="pill ok">Given</span>' })[s] || '';
const daysUntil = d => Math.round((new Date(d + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 864e5);

async function pageBirthdays() {
  await sb.rpc('open_gift_plans');
  const [people, gifts] = await Promise.all([
    sb.from('profiles').select('id,display_name,birthday').then(ok),
    sb.from('gifts').select('*').order('birthday_on', { ascending: false }).then(ok),
  ]);
  const name = uid => esc(people.find(p => p.id === uid)?.display_name || '?');
  const open = gifts.filter(g => g.status !== 'given').sort((a, b) => a.birthday_on < b.birthday_on ? -1 : 1);
  const given = gifts.filter(g => g.status === 'given');
  const upcoming = people.map(p => ({ ...p, nb: nextBirthday(p.birthday) })).sort((a, b) => (a.nb?.days ?? 1e9) - (b.nb?.days ?? 1e9));
  app.innerHTML = `<h1>Birthdays</h1>
  <p class="muted" style="margin-top:-8px">A gift plan opens automatically 4 weeks before each birthday, hidden from the birthday person until the present is handed over. Everyone else chips in the same amount (£25 unless the group changes it).</p>
  <div class="card"><h2>Gift plans on the go</h2>
    ${open.length ? open.map(g => `<a href="#gift/${g.id}" class="row" style="text-decoration:none;color:inherit;padding:10px 0;border-bottom:1px solid var(--line)">
      <span class="grow"><b>${name(g.recipient_id)}</b> · ${dayMonth(g.birthday_on)} <span class="muted">(${daysUntil(g.birthday_on) >= 0 ? 'in ' + daysUntil(g.birthday_on) + ' days' : 'passed'})</span></span>
      ${giftPill(g.status)} ${g.buyer_id ? `<span class="muted">buyer: ${who(g.buyer_id)}</span>` : '<span class="muted">no buyer yet</span>'}</a>`).join('')
      : '<p class="muted">Nothing open right now.</p>'}
  </div>
  <div class="card"><h2>Everyone's birthdays</h2><table>
    ${upcoming.map(p => { const has = p.nb && gifts.some(g => g.recipient_id === p.id && g.birthday_on === p.nb.date.toLocaleDateString('en-CA'));
      return `<tr><td>${who(p.id)}</td><td>${dayMonth(p.birthday)}</td><td class="muted">${p.nb ? (p.nb.days === 0 ? 'today!' : `in ${p.nb.days} days`) : 'not added'}</td>
      <td style="text-align:right">${p.id === me.id ? '<span class="muted">that\'s you: no peeking</span>' : !p.nb ? '' : has ? '<span class="muted">plan open</span>' : `<button class="btn small ghost" data-start="${p.id}">Start planning now</button>`}</td></tr>`; }).join('')}
  </table></div>
  ${given.length ? `<div class="card"><h2>Presents past</h2><div class="gallery">${given.map(g => `<a class="mini" href="#gift/${g.id}" style="text-decoration:none;color:inherit;cursor:pointer">
    ${g.photo_path ? `<img loading="lazy" src="${photoUrl(g.photo_path)}" alt="">` : '<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:48px;background:#000">🎁</div>'}
    <div><b>${esc(g.gift_title || 'Present')}</b><span class="muted">for ${name(g.recipient_id)}, ${new Date(g.birthday_on).getFullYear()}</span></div></a>`).join('')}</div></div>` : ''}`;
  $$('[data-start]').forEach(b => b.onclick = () => busy(b, async () => { const gid = await rpc('start_gift_plan', { p_recipient: b.dataset.start }); location.hash = 'gift/' + gid; }));
}

async function pageGift(id) {
  if (!/^[0-9a-f-]{36}$/.test(id || '')) { location.hash = 'birthdays'; return; }
  const g = await sb.from('gifts').select('*').eq('id', id).maybeSingle().then(ok);
  if (!g) { app.innerHTML = '<div class="card">Not found. (If it\'s your own birthday, that\'s on purpose.)</div>'; return; }
  const [people, ideas] = await Promise.all([
    sb.from('profiles').select('id,display_name,wishlist,armies').then(ok),
    sb.from('gift_ideas').select('*').eq('gift_id', id).order('created_at').then(ok),
  ]);
  const votes = ideas.length ? await sb.from('gift_idea_votes').select('*').in('idea_id', ideas.map(i => i.id)).then(ok) : [];
  const name = uid => esc(people.find(p => p.id === uid)?.display_name || '?');
  const r = people.find(p => p.id === g.recipient_id) || {};
  const chippers = people.length - 1, pot = chippers * Number(g.per_person);
  const iAmBuyer = g.buyer_id === me.id, isRecipient = g.recipient_id === me.id;
  const ranked = ideas.map(i => ({ ...i, vs: votes.filter(v => v.idea_id === i.id) })).sort((a, b) => b.vs.length - a.vs.length);
  const top = ranked[0];
  const coll = isRecipient ? [] : await sb.from('collection_items').select('*').eq('user_id', g.recipient_id).then(ok);

  app.innerHTML = `<p><a href="#birthdays" class="muted">← Birthdays</a></p>
  <div class="card">
    <div class="row"><h1 class="grow" style="margin:0;display:flex;gap:12px;align-items:center">${av(g.recipient_id, 44)} ${esc(r.display_name)}'s birthday 🎁</h1>${giftPill(g.status)}</div>
    <p style="margin:6px 0 0"><b>${fmtD(g.birthday_on)}</b> <span class="muted">${daysUntil(g.birthday_on) >= 0 ? '· in ' + daysUntil(g.birthday_on) + ' days' : ''}</span></p>
    ${g.status !== 'given' ? `<p class="muted" style="margin:8px 0 0">🔒 Hidden from ${esc(r.display_name)} until it's marked as given.</p>` : ''}
  </div>

  ${g.status === 'given' ? `<div class="card"><h2>The present</h2>
    ${g.photo_path ? `<img src="${photoUrl(g.photo_path)}" alt="" style="max-width:100%;max-height:420px;border-radius:10px;display:block;margin-bottom:12px">` : ''}
    <p style="font-size:18px;margin:0"><b>${g.gift_url ? `<a href="${esc(g.gift_url)}" target="_blank" rel="noopener" style="color:var(--gold)">${esc(g.gift_title || 'Present')}</a>` : esc(g.gift_title || 'Present')}</b></p>
    <p class="muted">From ${people.filter(p => p.id !== g.recipient_id).map(p => esc(p.display_name)).join(', ') || 'the group'}${g.buyer_id ? `. Bought by ${name(g.buyer_id)}` : ''}.</p></div>` : `
  <div class="card"><h2>What they're into</h2>
    ${r.armies ? `<h3>Armies</h3><div class="notes">${esc(r.armies)}</div>` : ''}
    ${r.wishlist ? `<h3 style="margin-top:12px">Wishlist</h3><div class="notes">${esc(r.wishlist)}</div>` : '<p class="muted">No wishlist on their profile.</p>'}
    <h3 style="margin-top:14px">What they already own</h3>${collectionHtml(coll, 'They haven\'t uploaded any army lists yet.')}
  </div>
  <div class="card"><h2>The pot</h2>
    <form id="ppf" class="row"><span>£</span><input type="number" id="pp" min="0" step="0.5" value="${Number(g.per_person)}" style="width:100px" ${g.status !== 'planning' ? 'disabled' : ''}>
      <span>each × ${chippers} people = <b style="font-size:18px">${money(pot)}</b></span>
      ${g.status === 'planning' ? '<button class="btn small ghost" id="ppgo">Update</button>' : ''}</form>
  </div>`}

  ${g.status === 'planning' ? `<div class="card"><h2>Ideas</h2>
    ${ranked.length ? `<table>${ranked.map(i => { const mine = i.vs.some(v => v.user_id === me.id);
      return `<tr><td>${i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener" style="color:var(--gold2)">${esc(i.title)} ↗</a>` : esc(i.title)}
        ${i.price != null ? `<span class="muted"> · ${money(i.price)}${Number(i.price) > pot ? ' (over the pot)' : ''}</span>` : ''}<br><span class="muted" style="font-size:13px">by ${name(i.added_by)}${i.vs.length ? ' · 👍 ' + i.vs.map(v => who(v.user_id)).join(' ') : ''}</span>${(() => { const o = alreadyOwns(coll, i.title); return o.length ? `<br><span style="color:#e0a070;font-size:13px">⚠ ${esc(r.display_name)} already owns ${o.map(x => esc(x.unit_name) + (x.models > 1 ? ' ×' + x.models : '')).join(', ')}</span>` : ''; })()}</td>
        <td style="text-align:right;white-space:nowrap"><button class="btn small ${mine ? '' : 'ghost'}" data-iv="${i.id}" data-on="${mine}">👍 ${i.vs.length}</button>
        ${i.added_by === me.id || me.is_admin ? `<button class="btn small ghost" data-deli="${i.id}">✕</button>` : ''}</td></tr>`; }).join('')}</table>` : '<p class="muted" style="margin-top:0">No ideas yet. Check their wishlist above.</p>'}
    <form id="idf" style="margin-top:12px"><div class="row"><input type="text" id="it" class="grow" maxlength="160" placeholder="Idea, e.g. Combat Patrol: Necrons" required>
      <input type="number" id="ip" min="0" step="0.01" placeholder="£ price" style="width:110px"></div>
      <div class="row" style="margin-top:8px"><input type="text" id="iu" class="grow" placeholder="Link (optional)"><button class="btn small" id="igo">Add idea</button></div></form>
  </div>
  <div class="card"><h2>Who's buying?</h2>
    ${g.buyer_id ? `<p><b>${who(g.buyer_id)}</b> is buying it.</p>` : '<p class="muted">Nobody yet. One person buys it and everyone pays them back.</p>'}
    ${!g.buyer_id ? '<button class="btn" id="claim">I\'ll buy it</button>' : iAmBuyer ? '<button class="btn small ghost" id="unclaim">Actually, someone else can</button>' : ''}
    ${iAmBuyer ? `<form id="bf" style="margin-top:16px"><h3>Bought it? Record it</h3>
      <label for="bt">What did you get?</label><input type="text" id="bt" maxlength="160" value="${esc(top?.title || '')}" required>
      <label for="bu">Link</label><input type="text" id="bu" value="${esc(top?.url || '')}">
      <label for="bc">What it cost in total £</label><input type="number" id="bc" min="0" step="0.01" value="${top?.price ?? ''}" required>
      <button class="btn" id="bgo">Mark as bought</button>
      <p class="muted" style="font-size:13px">This adds an expense on the Money page: everyone except ${esc(r.display_name)} owes you ${money(g.per_person)} each.</p></form>` : ''}
  </div>` : ''}

  ${g.status === 'bought' ? `<div class="card"><h2>Bought: ${g.gift_url ? `<a href="${esc(g.gift_url)}" target="_blank" rel="noopener" style="color:var(--gold)">${esc(g.gift_title)}</a>` : esc(g.gift_title)}</h2>
    <p>${name(g.buyer_id)} paid ${money(g.total_cost)}. The pot is ${money(pot)}${Number(g.total_cost) !== pot ? ` (${Number(g.total_cost) > pot ? money(Number(g.total_cost) - pot) + ' short' : money(pot - Number(g.total_cost)) + ' spare'})` : ''}.</p>
    <p>Everyone except ${esc(r.display_name)} owes ${name(g.buyer_id)} ${money(g.per_person)}. ${!iAmBuyer ? `<a href="#money/pay/${g.buyer_id}" style="color:var(--gold)">Record that you've paid →</a>` : '<a href="#money" style="color:var(--gold)">See who has paid →</a>'}</p>
    ${iAmBuyer ? `<form id="gf" style="margin-top:16px"><h3>Handed it over?</h3>
      <label for="gph">Photo of the present (optional)</label><input type="file" id="gph" accept="image/*">
      <button class="btn" id="ggo">Mark as given (reveals this page to ${esc(r.display_name)})</button>
      <button type="button" class="btn small ghost" id="undo" style="margin-left:8px">Undo "bought"</button></form>` : ''}
  </div>` : ''}
  ${g.status !== 'planning' ? '<div class="card" id="costs"></div>' : ''}`;
  if ($('#costs')) costsCard($('#costs'), 'gift', id, people).catch(e => $('#costs').innerHTML = `<p class="muted">${esc(e.message)}</p>`);

  const reload = () => pageGift(id);
  const run = (el, fn) => busy(el, async () => { await fn(); await reload(); });
  if ($('#ppf') && g.status === 'planning') $('#ppf').onsubmit = e => { e.preventDefault(); run($('#ppgo'), async () => ok(await sb.from('gifts').update({ per_person: +$('#pp').value }).eq('id', id))); };
  $$('[data-iv]').forEach(b => b.onclick = () => run(b, async () => ok(b.dataset.on === 'true'
    ? await sb.from('gift_idea_votes').delete().eq('idea_id', b.dataset.iv).eq('user_id', me.id)
    : await sb.from('gift_idea_votes').insert({ idea_id: b.dataset.iv, user_id: me.id }))));
  $$('[data-deli]').forEach(b => b.onclick = () => run(b, async () => ok(await sb.from('gift_ideas').delete().eq('id', b.dataset.deli))));
  if ($('#idf')) $('#idf').onsubmit = e => { e.preventDefault(); run($('#igo'), async () => {
    const url = $('#iu').value.trim(); if (url && !/^https?:\/\//.test(url)) throw new Error('Link should start with https://');
    const ins = await sb.from('gift_ideas').insert({ gift_id: id, title: $('#it').value.trim(), url: url || null, price: $('#ip').value === '' ? null : +$('#ip').value, added_by: me.id }).select('id').single().then(ok);
    await sb.from('gift_idea_votes').insert({ idea_id: ins.id, user_id: me.id });
  }); };
  if ($('#claim')) $('#claim').onclick = e => run(e.target, () => rpc('gift_claim_buyer', { p_gift: id, p_claim: true }));
  if ($('#unclaim')) $('#unclaim').onclick = e => run(e.target, () => rpc('gift_claim_buyer', { p_gift: id, p_claim: false }));
  if ($('#bf')) $('#bf').onsubmit = e => { e.preventDefault(); run($('#bgo'), async () => {
    const url = $('#bu').value.trim(); if (url && !/^https?:\/\//.test(url)) throw new Error('Link should start with https://');
    await rpc('gift_mark_bought', { p_gift: id, p_title: $('#bt').value.trim(), p_url: url, p_cost: +$('#bc').value });
  }); };
  if ($('#gf')) {
    $('#gf').onsubmit = e => { e.preventDefault(); run($('#ggo'), async () => {
      const f = $('#gph').files[0];
      const path = f ? await uploadPhoto(f, 'gifts', g.birthday_on.slice(0, 4)) : null;
      await rpc('gift_mark_given', { p_gift: id, p_photo: path });
    }); };
    $('#undo').onclick = e => run(e.target, () => rpc('gift_undo_bought', { p_gift: id }));
  }
}

// ---------- ventures ----------
const vStagePill = s => ({ idea: '<span class="pill">Idea</span>', proposal: '<span class="pill gold">Proposal</span>', declined: '<span class="pill">Withdrawn</span>',
  chartering: '<span class="pill gold">Agreeing charter</span>', active: '<span class="pill ok">Active</span>', closed: '<span class="pill">Closed</span>' })[s] || '';
const healthPill = h => ({ on_track: '<span class="pill ok">On track</span>', at_risk: '<span class="pill gold">At risk</span>', off_track: '<span class="pill" style="color:#e07a70;border-color:#e07a70">Off track</span>' })[h] || '';
const respLabel = { in: "🙋 I'm in", support: '👍 Support, not joining', concern: '⚠️ Concern' };
const PROPOSAL_FIELDS = [
  ['problem', 'The problem', 'What is wrong or missing today, and for whom?'],
  ['idea', 'The idea', 'What would we build or sell?'],
  ['audience', "Who it's for", 'Who pays, and how do we reach them?'],
  ['time_needed', 'Time it needs', 'e.g. 4 hours a week each for 3 months'],
  ['money_needed', 'Money it needs', 'e.g. £300 up front for stock and a domain'],
  ['skills', 'Skills needed', 'e.g. 3D modelling, shop setup, photography'],
  ['first_milestone', 'First milestone', 'The first concrete thing that proves it works'],
  ['success', 'Success in 6 months looks like…', ''],
  ['risks', "Risks, and what happens if it fails", ''],
];

async function pageVentures() {
  const rows = await rpc('ventures_directory');
  const by = s => rows.filter(v => v.stage === s);
  const ask = by('proposal').filter(v => !v.my_response);
  const live = rows.filter(v => ['chartering', 'active'].includes(v.stage));
  const row = v => {
    const open = ['idea', 'proposal', 'declined'].includes(v.stage) || v.i_am_member;
    const inner = `<div class="row" style="gap:10px">${av(v.created_by, 24)}<b class="grow">${esc(v.title)}</b>${vStagePill(v.stage)}</div>
      ${v.summary ? `<div class="muted" style="font-size:14px;margin-top:4px">${esc(v.summary)}</div>` : ''}
      <div class="muted" style="font-size:13px;margin-top:4px">${v.stage === 'proposal' ? `🙋 ${v.ins} in · 👍 ${v.supports} · ⚠️ ${v.concerns}${v.decide_by ? ' · decide by ' + dayMonth(v.decide_by) : ''}`
        : v.members.length ? 'Members: ' + esc(v.members.join(', ')) : ''}${!open ? ' · 🔒 private to its members' : ''}</div>`;
    return open ? `<a href="#venture/${v.id}" class="card" style="display:block;text-decoration:none;color:inherit;margin-bottom:10px;padding:14px 16px">${inner}</a>`
      : `<div class="card" style="margin-bottom:10px;padding:14px 16px;opacity:.8">${inner}</div>`;
  };
  app.innerHTML = `<div class="row"><h1 class="grow">Ventures</h1><button class="btn small" id="newv">+ New idea</button></div>
    <p class="muted" style="margin-top:-8px">Ideas anyone can float → proposals the group answers → launch once 2+ people are in → a charter everyone involved agrees → a private workspace for the people in it.</p>
    <div class="card hidden" id="newvf"><form id="nvf"><label for="vt">Idea in a few words</label><input type="text" id="vt" maxlength="100" required placeholder="e.g. Print-on-demand terrain shop">
      <label for="vsu">One or two lines on it</label><textarea id="vsu" maxlength="1000" style="min-height:60px"></textarea>
      <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="vprop"> Go straight to a full proposal</label>
      <button class="btn" id="vgo">Post</button></form></div>
    ${ask.length ? `<h2>Waiting for your answer</h2>${ask.map(row).join('')}` : ''}
    <h2 style="margin-top:20px">Proposals</h2>${by('proposal').length ? by('proposal').map(row).join('') : '<p class="muted">No open proposals.</p>'}
    <h2 style="margin-top:20px">Active</h2>${live.length ? live.map(row).join('') : '<p class="muted">No ventures running yet.</p>'}
    <h2 style="margin-top:20px">Ideas</h2>${by('idea').length ? by('idea').map(row).join('') : '<p class="muted">No loose ideas. Float one!</p>'}
    ${by('closed').length || by('declined').length ? `<h2 style="margin-top:20px">Closed &amp; withdrawn</h2>${[...by('closed'), ...by('declined')].map(row).join('')}` : ''}`;
  $('#newv').onclick = () => { $('#newvf').classList.toggle('hidden'); $('#vt').focus(); };
  $('#nvf').onsubmit = e => { e.preventDefault(); busy($('#vgo'), async () => {
    const v = await sb.from('ventures').insert({ title: $('#vt').value.trim(), summary: $('#vsu').value, stage: $('#vprop').checked ? 'proposal' : 'idea', created_by: me.id }).select('id').single().then(ok);
    location.hash = 'venture/' + v.id + ($('#vprop').checked ? '/edit' : '');
  }); };
}

async function pageVenture(id, tab) {
  if (!/^[0-9a-f-]{36}$/.test(id || '')) { location.hash = 'ventures'; return; }
  const v = await sb.from('ventures').select('*').eq('id', id).maybeSingle().then(ok);
  if (!v) { app.innerHTML = `<p><a href="#ventures" class="muted">← Ventures</a></p><div class="card">🔒 This venture is private to its members.</div>`; return; }
  const people = await sb.from('profiles').select('id,display_name').order('display_name').then(ok);
  const name = uid => esc(people.find(p => p.id === uid)?.display_name || '?');
  if (['idea', 'proposal', 'declined'].includes(v.stage)) return ventureProposal(v, people, name, tab);
  return ventureWorkspace(v, people, name, tab);
}

async function ventureProposal(v, people, name, tab) {
  const id = v.id, mine = v.created_by === me.id || me.is_admin;
  const [resps, comments] = await Promise.all([
    sb.from('venture_responses').select('*').eq('venture_id', id).then(ok),
    sb.from('venture_comments').select('*').eq('venture_id', id).order('created_at').then(ok),
  ]);
  const myResp = resps.find(r => r.user_id === me.id);
  const ins = resps.filter(r => r.response === 'in');
  const editing = tab === 'edit' && mine;
  app.innerHTML = `<p><a href="#ventures" class="muted">← Ventures</a></p>
  <div class="card">
    <div class="row"><h1 class="grow" style="margin:0">${esc(v.title)}</h1>${vStagePill(v.stage)}${v.stage === 'proposal' ? waShare(`New venture proposal: ${v.title}. Are you in?`, 'venture/' + v.id) : ''}</div>
    <p class="muted" style="margin:6px 0 0">${v.stage === 'idea' ? 'Idea' : 'Proposed'} by ${name(v.created_by)}${v.decide_by ? ` · decide by <b>${fmtD(v.decide_by)}</b>` : ''}</p>
    ${v.summary ? `<div class="notes" style="margin-top:12px">${esc(v.summary)}</div>` : ''}
    ${mine && !editing ? `<div class="row" style="margin-top:14px">
      ${v.stage === 'idea' ? `<a class="btn small" href="#venture/${id}/edit">${PROPOSAL_FIELDS.some(([k]) => v[k]) ? 'Review &amp; publish as a proposal' : 'Write it up as a proposal'}</a>` : ''}
      ${v.stage === 'proposal' ? `<a class="btn small ghost" href="#venture/${id}/edit">Edit proposal</a><button class="btn small ghost" data-stage="idea">Back to idea</button><button class="btn small ghost" data-stage="declined">Withdraw</button>` : ''}
      ${v.stage === 'declined' ? `<button class="btn small ghost" data-stage="proposal">Reopen</button>` : ''}
      <button class="btn small danger" id="vdel">Delete</button></div>` : ''}
  </div>
  ${editing ? `<div class="card"><h2>${v.stage === 'idea' ? 'Write it up as a proposal' : 'Edit proposal'}</h2><form id="pf">
    <label for="f_title">Name</label><input type="text" id="f_title" maxlength="100" value="${esc(v.title)}" required>
    <label for="f_summary">Summary (one or two lines)</label><textarea id="f_summary" maxlength="1000" style="min-height:60px">${esc(v.summary)}</textarea>
    ${PROPOSAL_FIELDS.map(([k, l, ph]) => `<label for="f_${k}">${l}</label><textarea id="f_${k}" maxlength="3000" placeholder="${esc(ph)}" style="min-height:70px">${esc(v[k])}</textarea>`).join('')}
    <label for="f_decide">Decide by (optional)</label><input type="date" id="f_decide" value="${v.decide_by || ''}" style="max-width:200px">
    <button class="btn" id="pgo">${v.stage === 'idea' ? 'Publish proposal' : 'Save'}</button> <a class="btn ghost" href="#venture/${id}">Cancel</a></form></div>` : ''}
  ${!editing && (v.stage !== 'idea' || PROPOSAL_FIELDS.some(([k]) => v[k])) ? `<div class="card"><h2>The proposal${v.stage === 'idea' ? ' <span class="pill">draft</span>' : ''}</h2>
    ${PROPOSAL_FIELDS.filter(([k]) => v[k]).map(([k, l]) => `<h3 style="margin-top:12px">${l}</h3><div class="notes">${esc(v[k])}</div>`).join('') || '<p class="muted">Not written up yet.</p>'}
  </div>` : ''}
  ${v.stage === 'proposal' ? `<div class="card"><h2>Your answer</h2>
    <p class="muted" style="margin-top:0">It launches once at least 2 people are in. People who aren't joining can't block it, but concerns stay on the record.</p>
    <div class="row">${Object.entries(respLabel).map(([k, l]) => `<button class="btn small ${myResp?.response === k ? '' : 'ghost'}" data-resp="${k}">${l}</button>`).join('')}
      ${myResp ? '<button class="btn small ghost" id="unresp">Clear my answer</button>' : ''}</div>
    <input type="text" id="rnote" maxlength="1000" placeholder="Note (optional, shown with your answer)" value="${esc(myResp?.note || '')}" style="margin-top:10px">
    <table style="margin-top:14px">${Object.entries(respLabel).map(([k, l]) => { const rs = resps.filter(r => r.response === k);
      return `<tr><td style="white-space:nowrap">${l}</td><td>${rs.length ? rs.map(r => `<b>${who(r.user_id)}</b>${r.note ? `: <span class="muted">${esc(r.note)}</span>` : ''}`).join('<br>') : '<span class="muted">—</span>'}</td></tr>`; }).join('')}
      <tr><td>No answer yet</td><td class="muted">${people.filter(p => !resps.some(r => r.user_id === p.id)).map(p => who(p.id)).join(' ') || '—'}</td></tr></table>
    ${ins.length >= 2 && myResp?.response === 'in' ? `<button class="btn" id="launch" style="margin-top:16px">🚀 Launch with ${ins.map(r => name(r.user_id)).join(', ')}</button>` : `<p class="muted" style="margin-bottom:0">${ins.length}/2 in so far.</p>`}
  </div>` : ''}
  <div class="card"><h2>Discussion</h2>
    ${comments.length ? comments.map(c => `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${name(c.user_id)}</b> <span class="muted" style="font-size:12px">${new Date(c.created_at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>

    if (!e.target.dataset.armed) { e.target.dataset.armed = 1; e.target.textContent = 'Click again to delete'; return; }

  $('#cf').onsubmit = e => { e.preventDefault(); run($('#cgo'), async () => ok(await sb.from('venture_comments').insert({ venture_id: id, user_id: me.id, body: $('#cb').value.trim() }))); };

const V_TABS = [['overview', 'Overview'], ['charter', 'Charter'], ['features', 'Features'], ['tasks', 'Tasks'], ['money', 'Money'], ['decisions', 'Decisions'], ['updates', 'Updates'], ['links', 'Links'], ['proposal', 'Proposal']];
async function ventureWorkspace(v, people, name, tab) {
  const id = v.id;
  const [members, charter, agreements] = await Promise.all([
    sb.from('venture_members').select('*').eq('venture_id', id).then(ok),
    sb.from('venture_charters').select('*').eq('venture_id', id).maybeSingle().then(ok),
    sb.from('venture_charter_agreements').select('*').eq('venture_id', id).then(ok),
  ]);
  const agreedNow = members.filter(m => agreements.some(a => a.user_id === m.user_id && a.version === charter?.version));
  const allAgreed = agreedNow.length === members.length;
  if (!tab || !V_TABS.some(([k]) => k === tab)) tab = v.stage === 'chartering' ? 'charter' : 'overview';
  const closed = v.stage === 'closed';
  app.innerHTML = `<p><a href="#ventures" class="muted">← Ventures</a></p>
    <div class="row" style="margin-bottom:6px"><h1 class="grow" style="margin:0">${esc(v.title)}</h1>${vStagePill(v.stage)} ${v.stage === 'active' ? healthPill(v.health) : ''}</div>
    <p class="muted" style="margin:0 0 12px">🔒 Private to ${members.map(m => who(m.user_id) + (m.role === 'lead' ? ' (lead)' : '')).join(', ')}</p>
    ${v.stage === 'chartering' ? `<div class="card" style="border-color:var(--gold)"><b>Agree the charter to go live.</b> ${agreedNow.length}/${members.length} have agreed this version. Everything else works already; the venture shows as active once everyone has agreed.</div>`
      : v.stage === 'active' && !allAgreed ? `<div class="card" style="border-color:var(--gold)">⚠️ The charter changed and not everyone has agreed the new version (${agreedNow.length}/${members.length}). <a href="#venture/${id}/charter" style="color:var(--gold)">Review it</a>.</div>` : ''}
    <div class="tabs2">${V_TABS.map(([k, l]) => `<a class="btn small ${k === tab ? '' : 'ghost'}" href="#venture/${id}/${k}">${l}</a>`).join('')}</div>
    <div id="vt"><div class="empty">Loading…</div></div>`;
  const el = $('#vt');
  const reload = () => pageVenture(id, tab);
  const run = (b, fn) => busy(b, async () => { await fn(); await reload(); });
  const ownerSel = (idAttr, cur, blank = 'Nobody yet') => `<select id="${idAttr}" class="sel">${`<option value="">${blank}</option>`}${members.map(m => `<option value="${m.user_id}" ${m.user_id === cur ? 'selected' : ''}>${name(m.user_id)}</option>`).join('')}</select>`;

  if (tab === 'overview') {
    const [tasks, feats, ups, money] = await Promise.all([
      sb.from('venture_tasks').select('status,owner_id,due_on,title').eq('venture_id', id).then(ok),
      sb.from('venture_features').select('status').eq('venture_id', id).then(ok),
      sb.from('venture_updates').select('*').eq('venture_id', id).order('created_at', { ascending: false }).limit(1).then(ok),
      sb.from('venture_money').select('kind,amount,member_id').eq('venture_id', id).then(ok),
    ]);
    const sum = k => money.filter(x => x.kind === k).reduce((a, x) => a + Number(x.amount), 0);
    const nonMembers = people.filter(p => !members.some(m => m.user_id === p.id));
    const myTasks = tasks.filter(t => t.owner_id === me.id && t.status !== 'done');
    el.innerHTML = `<div class="grid">
      <div class="card"><h2>Status</h2>${closed ? `<p>Closed: <b>${esc(v.outcome || '')}</b></p>${v.learned ? `<h3>What we learned</h3><div class="notes">${esc(v.learned)}</div>` : ''}` : `<form id="sf">
        <label for="sh">Health</label><select id="sh" style="${selStyle}">${['on_track', 'at_risk', 'off_track'].map(h => `<option value="${h}" ${v.health === h ? 'selected' : ''}>${h.replace('_', ' ')}</option>`).join('')}</select>
        <label for="sn">Next milestone</label><input type="text" id="sn" maxlength="500" value="${esc(v.next_milestone)}" placeholder="${esc(v.first_milestone || 'What are we aiming at next?')}">
        <label for="ss">Where we are</label><textarea id="ss" maxlength="1000" style="min-height:60px">${esc(v.status_note)}</textarea>
        <button class="btn small" id="sgo" style="margin-top:10px">Save</button></form>`}</div>
      <div class="card"><h2>At a glance</h2><table>
        <tr><td>Tasks</td><td>${tasks.filter(t => t.status === 'todo').length} to do · ${tasks.filter(t => t.status === 'doing').length} doing · ${tasks.filter(t => t.status === 'done').length} done</td></tr>
        <tr><td>Your open tasks</td><td>${myTasks.length ? myTasks.map(t => esc(t.title)).join(', ') : '<span class="muted">none</span>'}</td></tr>
        <tr><td>Features</td><td>${['idea', 'planned', 'building', 'shipped'].map(s => `${feats.filter(f => f.status === s).length} ${s}`).join(' · ')}</td></tr>
        <tr><td>Money</td><td>${money.length ? `${money_(sum('contribution'))} put in · ${money_(sum('expense'))} spent · ${money_(sum('revenue'))} earned` : '<span class="muted">nothing recorded</span>'}</td></tr>
      </table></div>
      <div class="card"><h2>Latest update</h2>${ups[0] ? `<p class="muted" style="margin-top:0">${name(ups[0].user_id)}, ${new Date(ups[0].created_at).toLocaleDateString('en-GB')}</p>${ups[0].did ? `<div class="notes">${esc(ups[0].did)}</div>` : ''}` : '<p class="muted">No updates yet.</p>'}
        <a class="btn small ghost" href="#venture/${id}/updates">Post an update</a></div>
      <div class="card"><h2>Members</h2><table>${members.map(m => `<tr><td>${who(m.user_id)}${m.role === 'lead' ? ' <span class="pill gold">lead</span>' : ''}</td><td>${Number(m.share_pct)}%</td></tr>`).join('')}</table>
        ${!closed ? `${nonMembers.length ? `<div class="row" style="margin-top:12px"><select id="addm" style="${selStyle}">${nonMembers.map(p => `<option value="${p.id}">${esc(p.display_name)}</option>`).join('')}</select><button class="btn small ghost" id="addgo">Add to venture</button></div>
          <p class="muted" style="font-size:13px">New members start at 0% and everyone re-agrees the charter.</p>` : ''}
          <div class="row" style="margin-top:12px"><button class="btn small ghost" id="leave">Leave venture</button><button class="btn small danger" id="closev">Close venture…</button></div>
          <form id="clf" class="hidden" style="margin-top:12px"><label for="clo">Outcome</label><select id="clo" style="${selStyle}"><option value="shipped">Shipped</option><option value="sold">Sold</option><option value="shelved">Shelved</option><option value="merged">Merged into something else</option></select>
            <label for="cll">What we learned</label><textarea id="cll" maxlength="3000"></textarea><button class="btn danger" id="clgo">Close it</button></form>` : ''}
      </div></div>`;

// Pull units out of a pasted army list (Warhammer app, New Recruit, most text exports).
// Unit lines look like "Necron Warriors (200 points)" or "Overlord [85 pts]"; models come from the "• 20x Necron Warrior" lines under it.
function parseArmyList(text) {
  const lines = String(text).replace(/\r/g, '').split('\n').filter(l => l.trim());
  const B = '•◦\\-\\*·.';   // bullet characters used by the various exporters
  const depthOf = l => l.match(new RegExp(`^[\\s${B}]*`))[0].replace(new RegExp(`[${B}]`, 'g'), '  ').length;
  const isBullet = l => depthOf(l) > 0;
  const unitRe = /^(?:\d+\s*x\s+)?(.+?)\s*[\(\[]\s*([\d,.]+)\s*(?:pts?|points?)\s*[\)\]]\s*:?.*$/i;
  const skip = /(strike force|incursion|onslaught|combat patrol|roster|detachment|battle ?size|^total|^\+|^#|^=|regiment|army of renown|spearhead|battle tactic|grand alliance|configuration)/i;
  const words = s => normName(s).split(' ').filter(w => w.length > 2);
  const aos = /age of sigmar|grand alliance|regiment|battle tactic|spell lore|prayer lore|manifestation lore/i.test(text);
  const units = []; let faction = '', stopF = false;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim(), m = i > 0 && !isBullet(lines[i]) && line.match(unitRe);   // line 1 is the list's own name
    if (!m) {
      // the army name: a short plain line before the first unit, not the list title (line 1), not a heading or config line
      // In Warhammer app exports the army name follows the title: "Space Marines" then, if there is one, the chapter ("Space Wolves").
      // Stop at the first line with points/detachment in it; the most specific name before that wins.
      if (i > 0 && !units.length && !stopF) {
        if (/points|detachment|\(|\[|:|^\+/i.test(line)) stopF = true;
        else if (!isBullet(lines[i]) && line !== line.toUpperCase() && line.length < 40) faction = line;
      }
      continue;
    }
    const name = m[1].replace(/\s+/g, ' ').trim(), pts = +m[2].replace(/[,.]/g, '');
    if (skip.test(name) || pts >= 600 || name.length > 80) { stopF = true; continue; }
    // the lines belonging to this unit, up to the next non-bullet line
    const kids = []; for (let j = i + 1; j < lines.length && isBullet(lines[j]); j++) kids.push({ raw: lines[j], d: depthOf(lines[j]) });
    const top = Math.min(...kids.map(k => k.d), Infinity), uw = words(name);
    let models = 0;
    kids.forEach((k, idx) => {
      if (k.d !== top) return;
      const c = k.raw.replace(new RegExp(`^[\\s${B}]+`), '').match(/^(\d+)\s*x\s+([^:,]+)/i); if (!c) return;
      const hasChildren = kids[idx + 1] && kids[idx + 1].d > k.d;
      const sameName = words(c[2]).some(w => uw.some(u => u.startsWith(w.slice(0, 5)) || w.startsWith(u.slice(0, 5))));
      if (sameName || hasChildren) models += +c[1];   // a model line, not a piece of wargear
    });
    units.push({ name, models: models || 1, points: pts });
  }
  return { system: aos ? 'aos' : '40k', faction, units };
}

// "Does this person already own something like this?" Loose match on unit names, for gift ideas.
const normName = s => String(s).toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\b(the|of|and|with|box|set|kit|squad|unit|warhammer|40k|aos|combat patrol|spearhead)\b/g, ' ').replace(/s\b/g, '').replace(/\s+/g, ' ').trim();
function alreadyOwns(collection, idea) {
  const n = normName(idea); if (n.length < 3) return [];
  return collection.filter(c => { const u = normName(c.unit_name); return u.length >= 3 && (n.includes(u) || u.includes(n)); });
}
function collectionHtml(items, emptyText) {
  if (!items.length) return `<p class="muted" style="margin:0">${emptyText}</p>`;
  const groups = {};
  items.forEach(i => { const k = `${SYSTEMS[i.system]}${i.faction ? ' · ' + i.faction : ''}`; (groups[k] = groups[k] || []).push(i); });
  return Object.entries(groups).sort().map(([k, v]) => `<h3 style="margin:12px 0 6px">${esc(k)} <span class="muted" style="font-weight:400;font-size:13px">${v.reduce((a, i) => a + i.models, 0)} models</span></h3>
    <div style="display:flex;flex-wrap:wrap;gap:6px">${v.sort((a, b) => a.unit_name.localeCompare(b.unit_name)).map(i => `<span class="pill" title="${esc(i.notes)}">${esc(i.unit_name)}${i.models > 1 ? ` ×${i.models}` : ''}</span>`).join('')}</div>`).join('');
}

// Elo: everyone starts at 1000, K = 32. Returns ratings plus each game's rating change.
function computeElo(games, players) {
  const R = {}, delta = {}, K = 32;
  games.slice().sort((a, b) => a.played_on.localeCompare(b.played_on) || a.created_at.localeCompare(b.created_at)).forEach(g => {
    const ps = players.filter(p => p.game_id === g.id); if (ps.length !== 2) return;
    const [a, b] = ps, ra = R[a.user_id] ?? 1000, rb = R[b.user_id] ?? 1000;
    const ea = 1 / (1 + 10 ** ((rb - ra) / 400)), sa = a.result === 'win' ? 1 : a.result === 'draw' ? .5 : 0;
    const d = K * (sa - ea); R[a.user_id] = ra + d; R[b.user_id] = rb - d; delta[g.id] = { [a.user_id]: d, [b.user_id]: -d };
  });
  return { R, delta };
}

const londonToday = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/London' });
const monthLabel = m => new Date(m + 'T00:00:00').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
const lastDay = m => { const d = new Date(m + 'T00:00:00'); return new Date(d.getFullYear(), d.getMonth() + 1, 0); };
// Who still owes a round: in a finished month, didn't opt out, didn't finish, round not marked bought.
function roundsOwed(chals, entries, curMonth) {
  const out = [];
  chals.filter(c => c.month < curMonth && c.theme).forEach(c => Object.keys(PEOPLE).forEach(u => {
    const e = entries.find(x => x.month === c.month && x.user_id === u);
    if (!e || (!e.opted_out && !e.finished_at && !e.round_bought_at)) out.push({ month: c.month, user_id: u, theme: c.theme });
  }));
  return out;
}
async function loadChallenges() {
  await rpc('paint_challenge_tick').catch(() => {});
  const [chals, entries] = await Promise.all([
    sb.from('paint_challenges').select('*').order('month', { ascending: false }).then(ok),
    sb.from('paint_challenge_entries').select('*').then(ok),
  ]);
  return { chals, entries, cur: londonToday().slice(0, 7) + '-01' };
}
function roundsOwedHtml(owed) {
  return owed.length ? `<table>${owed.map(o => `<tr><td>${who(o.user_id)}</td><td class="muted" style="font-size:13px">${monthLabel(o.month)}: ${esc(o.theme)}</td>

}
function wireRounds(el, reload) {

const AWARDS = { mvp: '🏅 Man of the match', lucky: '🍀 Blessed dice', cursed: '💀 Cursed dice', heretic: '📜 Most heretical rules call', legend: '🍺 Last one standing' };
function awardWinners(votes) {   // per award: the person (or people) with the most votes
  const out = {};
  Object.keys(AWARDS).forEach(k => { const c = {}; votes.filter(v => v.award === k).forEach(v => c[v.nominee] = (c[v.nominee] || 0) + 1);
    const top = Math.max(0, ...Object.values(c)); if (top) out[k] = { who: Object.keys(c).filter(u => c[u] === top), n: top }; });
  return out;
}

// ---------- money (built-in expense sharing) ----------
// Settle the whole group in as few transfers as possible: biggest debtor pays biggest creditor, repeat.
function simplifyDebts(pairs) {
  const net = {};
  pairs.forEach(p => { const a = Math.round(p.amount * 100); net[p.debtor] = (net[p.debtor] || 0) - a; net[p.creditor] = (net[p.creditor] || 0) + a; });
  const owe = Object.entries(net).filter(([, v]) => v < 0).map(([k, v]) => [k, -v]).sort((a, b) => b[1] - a[1]);
  const get = Object.entries(net).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const out = []; let i = 0, j = 0;
  while (i < owe.length && j < get.length) {
    const x = Math.min(owe[i][1], get[j][1]);
    out.push({ from: owe[i][0], to: get[j][0], amount: x / 100 });
    owe[i][1] -= x; get[j][1] -= x;
    if (!owe[i][1]) i++; if (!get[j][1]) j++;
  }
  return out;
}
const canEditExpense = e => !e.hidden && (e.created_by === me.id || e.paid_by === me.id || me.is_admin);

  return `<tr class="xrow" data-x="${e.id}" style="cursor:pointer"><td style="white-space:nowrap" class="muted">${new Date(e.spent_on + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</td>

async function pageMoney(arg, arg2) {
  if (arg === 'new' || arg === 'edit' || arg === 'meetup' || arg === 'gift') return pageExpenseForm(arg, arg2);
  if (arg === 'pay') return pageSettle(arg2);
  const [people, pairs, feed, setts] = await Promise.all([
    sb.from('profiles').select('id,display_name').order('display_name').then(ok),
    rpc('ledger_balances'), rpc('ledger_feed', { p_limit: 300 }),
    sb.from('settlements').select('*').is('deleted_at', null).order('paid_on', { ascending: false }).order('created_at', { ascending: false }).limit(100).then(ok),
  ]);
  const name = uid => who(uid, uid === me.id ? 'You' : esc(people.find(p => p.id === uid)?.display_name || '?'));
  // Like Splitwise's "simplify debts": the simplified plan IS what people owe; raw pairwise debts are just the workings.
  const plan = simplifyDebts(pairs);
  const iOwe = plan.filter(p => p.from === me.id), owedMe = plan.filter(p => p.to === me.id);
  const net = owedMe.reduce((a, p) => a + p.amount, 0) - iOwe.reduce((a, p) => a + p.amount, 0);
  const toConfirm = setts.filter(s => s.to_user === me.id && !s.confirmed_at);
  const nets = {}; plan.forEach(p => { nets[p.from] = (nets[p.from] || 0) - p.amount; nets[p.to] = (nets[p.to] || 0) + p.amount; });
  const acts = [...feed.map(e => ({ t: 'x', d: e.spent_on, c: e.created_at, e })), ...setts.map(s => ({ t: 's', d: s.paid_on, c: s.created_at, s }))]
    .sort((a, b) => b.d.localeCompare(a.d) || b.c.localeCompare(a.c));

  app.innerHTML = `
  <div class="card"><div class="row"><h1 class="grow" style="margin:0">Money</h1><a class="btn small" href="#money/new">+ Add expense</a><a class="btn small ghost" href="#money/pay">Record a payment</a></div>
    <p style="font-size:20px;margin:14px 0 4px">${Math.abs(net) < 0.005 ? 'You\'re all square.' : net > 0 ? `Overall you're owed <b style="color:var(--ok)">${money_(net)}</b>` : `Overall you owe <b style="color:#e0a070">${money_(-net)}</b>`}</p>
    ${iOwe.length || owedMe.length ? `<table style="margin-top:8px">${iOwe.map(p => `<tr><td>Pay <b>${name(p.to)}</b></td><td>${money_(p.amount)}</td><td style="text-align:right"><a class="btn small" href="#money/pay/${p.to}">I've paid</a></td></tr>`).join('')}
      ${owedMe.map(p => `<tr><td><b>${name(p.from)}</b> pays you</td><td>${money_(p.amount)}</td><td style="text-align:right"><a class="btn small ghost" href="#money/pay/${p.from}">They've paid me</a></td></tr>`).join('')}</table>` : ''}
    <p class="muted" style="font-size:13px;margin-bottom:0">Paying happens by bank transfer as usual. This just records it.</p>
  </div>

  ${toConfirm.length ? `<div class="card" style="border-color:var(--gold)"><h2>Did these arrive?</h2><table>${toConfirm.map(s => `<tr><td><b>${name(s.from_user)}</b> says they paid you ${money_(s.amount)} <span class="muted">on ${new Date(s.paid_on + 'T00:00:00').toLocaleDateString('en-GB')}${s.note ? ' · ' + esc(s.note) : ''}</span></td>
    <td style="text-align:right;white-space:nowrap"><button class="btn small" data-conf="${s.id}">Yes, got it</button> <button class="btn small ghost" data-sdel="${s.id}">No</button></td></tr>`).join('')}</table></div>` : ''}

  <div class="card"><h2>Everyone</h2>
    ${plan.length ? `<table>${plan.map(p => `<tr><td>${name(p.from)} pays ${name(p.to)}</td><td style="text-align:right">${money_(p.amount)}</td></tr>`).join('')}</table>
      <p class="muted" style="font-size:13px">Debts are simplified so the group settles in as few payments as possible (${plan.length} right now). It's fine to pay someone you never shared a bill with: the totals all work out.</p>
      <details><summary class="muted" style="cursor:pointer;font-size:13px">Overall position per person</summary><table style="margin-top:6px">${Object.entries(nets).sort((a, b) => b[1] - a[1]).map(([u, v]) => `<tr><td>${name(u)}</td><td style="text-align:right;color:${v > 0 ? 'var(--ok)' : '#e0a070'}">${v > 0 ? 'owed ' : 'owes '}${money_(Math.abs(v))}</td></tr>`).join('')}</table></details>` : '<p class="muted" style="margin:0">Nobody owes anybody anything.</p>'}
  </div>

  <div class="card"><h2>Activity</h2>
    ${acts.length ? `<table>${acts.map(a => a.t === 'x' ? expenseRow(a.e, name) : `<tr><td class="muted" style="white-space:nowrap">${new Date(a.s.paid_on + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</td>
      <td>💸 <b>${name(a.s.from_user)}</b> paid <b>${name(a.s.to_user)}</b> ${money_(a.s.amount)}${a.s.note ? ` <span class="muted">· ${esc(a.s.note)}</span>` : ''}</td>
      <td style="text-align:right;font-size:13px">${a.s.confirmed_at ? '<span class="pill ok">Confirmed</span>' : '<span class="pill">Awaiting ' + esc(PEOPLE[a.s.to_user]?.display_name || '?') + '</span>'}
        ${(a.s.created_by === me.id && !a.s.confirmed_at) || a.s.to_user === me.id || me.is_admin ? ` <button class="btn small ghost" data-sdel="${a.s.id}" title="Remove">✕</button>` : ''}</td></tr>`).join('')}</table>`
      : '<p class="muted" style="margin:0">Nothing yet. Add the first expense: a cottage deposit, a pub tab, the pizza…</p>'}
  </div>`;

  const reload = () => pageMoney();
