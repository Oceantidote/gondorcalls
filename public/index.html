  $$('[data-sdel]').forEach(b => b.onclick = () => { if (confirm('Remove this payment? The balance goes back to what it was.')) busy(b, async () => { await rpc('settlement_delete', { p_id: b.dataset.sdel }); await reload(); }); });
}

async function pageSettle(other) {
  const [people, pairs] = await Promise.all([sb.from('profiles').select('id,display_name').order('display_name').then(ok), rpc('ledger_balances')]);
  const others = people.filter(p => p.id !== me.id), plan = simplifyDebts(pairs);
  const owes = (d, c) => +(plan.find(p => p.from === d && p.to === c)?.amount || 0);
  app.innerHTML = `<p><a href="#money" class="muted">← Money</a></p><div class="card narrow" style="margin-top:0"><h1>Record a payment</h1>
    <form id="sf">
      <label for="sdir">What happened?</label><select id="sdir" style="width:100%;padding:10px;background:#110e0c;color:var(--text);border:1px solid var(--line);border-radius:8px"><option value="out">I paid someone</option><option value="in">Someone paid me</option></select>
      <label for="swho">Who?</label><select id="swho" style="width:100%;padding:10px;background:#110e0c;color:var(--text);border:1px solid var(--line);border-radius:8px">${others.map(p => `<option value="${p.id}" ${p.id === other ? 'selected' : ''}>${esc(p.display_name)}</option>`).join('')}</select>
      <label for="samt">Amount £</label><input type="number" id="samt" min="0.01" step="0.01" required>
      <label for="sdate">Date</label><input type="date" id="sdate" value="${todayISO()}">
      <label for="snote">Note (optional)</label><input type="text" id="snote" maxlength="200" placeholder="e.g. bank transfer">
      <p class="muted" id="shint" style="font-size:13px"></p>
      <button class="btn" id="sgo">Record it</button></form></div>`;
  const sync = () => {
    const w = $('#swho').value, out = $('#sdir').value === 'out', due = out ? owes(me.id, w) : owes(w, me.id);
    if (due && !$('#samt').dataset.touched) $('#samt').value = due.toFixed(2);
    $('#shint').textContent = (due ? (out ? `You're due to pay them ${money_(due)}. ` : `They're due to pay you ${money_(due)}. `) : '') + (out ? 'They\'ll be asked to confirm it arrived.' : 'This counts as confirmed, since you received it.');
  };
  if (other && owes(other, me.id) && !owes(me.id, other)) $('#sdir').value = 'in';
  $('#samt').oninput = () => { $('#samt').dataset.touched = 1; };
  $('#swho').onchange = $('#sdir').onchange = () => { delete $('#samt').dataset.touched; sync(); };
  sync();
  $('#sf').onsubmit = e => { e.preventDefault(); busy($('#sgo'), async () => {
    const w = $('#swho').value, out = $('#sdir').value === 'out';
    await rpc('settlement_add', { p_from: out ? me.id : w, p_to: out ? w : me.id, p_amount: +$('#samt').value, p_paid_on: $('#sdate').value || todayISO(), p_note: $('#snote').value.trim() });
    toast('Recorded'); location.hash = 'money';
  }); };
}

// Add/edit form. Routes: #money/new · #money/meetup/<id> · #money/gift/<id> · #money/edit/<expense id>
async function pageExpenseForm(kind, ref) {
  const people = await sb.from('profiles').select('id,display_name').order('display_name').then(ok);
  let e = null, meetup = null, gift = null, preselect = people.map(p => p.id);
  if (kind === 'edit') {
    e = (await rpc('ledger_feed', { p_limit: 1000 })).find(x => x.id === ref);
    if (!e || !canEditExpense(e)) { app.innerHTML = '<div class="card">You can\'t edit that expense.</div>'; return; }
    if (e.meetup_id) meetup = await sb.from('meetups').select('id,title,hidden_from').eq('id', e.meetup_id).maybeSingle().then(ok);
    if (e.gift_id) gift = await sb.from('gifts').select('id,recipient_id,hidden_from').eq('id', e.gift_id).maybeSingle().then(ok);
    preselect = e.shares.map(s => s.user_id);
  } else if (kind === 'meetup') {
    meetup = await sb.from('meetups').select('id,title,hidden_from').eq('id', ref).maybeSingle().then(ok);
    if (!meetup) { app.innerHTML = '<div class="card">Meetup not found.</div>'; return; }
    const going = await sb.from('meetup_rsvps').select('user_id').eq('meetup_id', ref).eq('status', 'going').then(ok);
    if (going.length) preselect = going.map(r => r.user_id);
  } else if (kind === 'gift') {
    gift = await sb.from('gifts').select('id,recipient_id,hidden_from').eq('id', ref).maybeSingle().then(ok);
    if (!gift) { app.innerHTML = '<div class="card">Not found.</div>'; return; }
  }
  const hidden = (meetup || gift)?.hidden_from || [];
  const eligible = people.filter(p => !hidden.includes(p.id));
  preselect = preselect.filter(id => eligible.some(p => p.id === id));
  const weight = id => { const s = e?.shares.find(x => x.user_id === id); return s ? (e.split_mode === 'exact' ? s.owed : s.weight) : ''; };
  const mode0 = e?.split_mode || 'equal';
  const back = meetup ? `#meetup/${meetup.id}` : gift ? `#gift/${gift.id}` : '#money';
  const sel = 'style="width:100%;padding:10px;background:#110e0c;color:var(--text);border:1px solid var(--line);border-radius:8px"';
  const recipName = gift ? esc(people.find(p => p.id === gift.recipient_id)?.display_name) : '';

  app.innerHTML = `<p><a href="${back}" class="muted">← Back</a></p><div class="card" style="max-width:620px">
    <h1>${e ? 'Edit expense' : 'Add an expense'}</h1>
    ${meetup ? `<p class="muted" style="margin-top:0">For <b>${esc(meetup.title)}</b></p>` : gift ? `<p class="muted" style="margin-top:0">For ${recipName}'s present (hidden from ${recipName})</p>` : ''}
    <form id="xf">
      <label for="xd">What for?</label><input type="text" id="xd" maxlength="120" required value="${esc(e?.description || '')}" placeholder="e.g. Cottage deposit, Friday pizza">
      <div class="row"><div class="grow" style="min-width:140px"><label for="xa">Amount £</label><input type="number" id="xa" min="0.01" step="0.01" required value="${e?.amount ?? ''}"></div>
        <div class="grow" style="min-width:140px"><label for="xp">Paid by</label><select id="xp" ${sel}>${eligible.map(p => `<option value="${p.id}" ${(e ? e.paid_by : me.id) === p.id ? 'selected' : ''}>${p.id === me.id ? 'Me' : esc(p.display_name)}</option>`).join('')}</select></div>
        <div style="min-width:140px"><label for="xdt">Date</label><input type="date" id="xdt" value="${e?.spent_on || todayISO()}"></div></div>
      <label>Split</label>
      <div class="row">${[['equal', 'Equally'], ['shares', 'By shares'], ['exact', 'Exact amounts']].map(([m, l]) => `<label style="margin:0;display:flex;gap:6px;align-items:center;color:var(--text);font-weight:500"><input type="radio" name="xm" value="${m}" ${m === mode0 ? 'checked' : ''}>${l}</label>`).join('')}</div>
      <p class="muted" style="font-size:13px;margin:6px 0" id="xhelp"></p>
      <table id="xppl">${eligible.map(p => `<tr><td style="width:36px"><input type="checkbox" data-p="${p.id}" ${preselect.includes(p.id) ? 'checked' : ''} style="width:18px;height:18px"></td>
        <td>${who(p.id, p.id === me.id ? 'Me' : esc(p.display_name))}</td>
        <td style="width:130px"><input type="number" data-w="${p.id}" min="0" step="0.01" value="${weight(p.id)}" style="padding:6px 8px"></td>
        <td style="width:90px;text-align:right" class="muted" data-o="${p.id}"></td></tr>`).join('')}</table>
      <p style="margin:8px 0 0" id="xsum"></p>
      <label for="xn">Notes (optional)</label><textarea id="xn" maxlength="1000" style="min-height:60px">${esc(e?.notes || '')}</textarea>
      <button class="btn" id="xgo">${e ? 'Save' : 'Add expense'}</button>
    </form></div>`;

  const mode = () => $('input[name=xm]:checked').value;
  const recalc = () => {
    const m = mode(), amt = Math.round((+$('#xa').value || 0) * 100);
    $('#xhelp').textContent = { equal: 'Tick who it was for. It\'s split evenly between them.', shares: 'Give each person a number of shares, e.g. 2 for two nights, 1 for one.', exact: 'Type exactly what each person owes. It must add up to the total.' }[m];
    $$('[data-w]').forEach(i => { i.style.visibility = m === 'equal' ? 'hidden' : ''; i.placeholder = m === 'shares' ? '1' : '£'; });
    const on = $$('[data-p]').filter(c => c.checked).map(c => c.dataset.p);
    const w = id => m === 'equal' ? 1 : m === 'shares' ? (+$(`[data-w="${id}"]`).value || 1) : Math.round((+$(`[data-w="${id}"]`).value || 0) * 100);
    $$('[data-o]').forEach(td => td.textContent = '');
    if (!on.length || !amt) { $('#xsum').innerHTML = ''; return; }
    if (m === 'exact') {
      const tot = on.reduce((a, id) => a + w(id), 0);
      on.forEach(id => $(`[data-o="${id}"]`).textContent = money_(w(id) / 100));
      $('#xsum').innerHTML = tot === amt ? '<span style="color:var(--ok)">Adds up ✓</span>' : `<span style="color:#e0a070">${money_(Math.abs(amt - tot) / 100)} ${tot < amt ? 'left to assign' : 'too much'}</span>`;
    } else {   // preview only; the server does the final penny-exact split
      const W = on.reduce((a, id) => a + w(id), 0);
      on.forEach(id => $(`[data-o="${id}"]`).textContent = '≈ ' + money_(amt * w(id) / W / 100));
      $('#xsum').innerHTML = '';
    }
  };
  $('#xf').oninput = recalc; $('#xf').onchange = recalc; recalc();
  $('#xf').onsubmit = ev => { ev.preventDefault(); busy($('#xgo'), async () => {
    const m = mode(), on = $$('[data-p]').filter(c => c.checked).map(c => c.dataset.p);
    if (!on.length) throw new Error('Tick who this was for');
    const ppl = on.map(id => ({ user_id: id, value: m === 'equal' ? 1 : m === 'shares' ? (+$(`[data-w="${id}"]`).value || 1) : (+$(`[data-w="${id}"]`).value || 0) }));
    await rpc('expense_save', { p_id: e?.id || null, p_description: $('#xd').value.trim(), p_amount: +$('#xa').value, p_paid_by: $('#xp').value,
      p_spent_on: $('#xdt').value || todayISO(), p_mode: m, p_people: ppl, p_meetup: meetup?.id || null, p_gift: gift?.id || null, p_notes: $('#xn').value.trim() });
    toast(e ? 'Saved' : 'Added'); location.hash = back.slice(1);
  }); };
}

    const r = rows[+el.dataset.i];
    const lb = document.createElement('div'); lb.className = 'lightbox';
    lb.innerHTML = `<img src="${photoUrl(r.photo_path)}" alt=""><p><b>${esc(r.title)}</b><br><span class="muted">${esc(r.subtitle)} · ${r.year}</span></p><a class="btn small ghost" href="${r.link}">Open</a>`;
    lb.onclick = e => { if (e.target.tagName !== 'A') lb.remove(); else lb.remove(); };
    document.body.appendChild(lb);
  });
}

// ---------- admin ----------
async function pageAdmin() {
  if (!me.is_admin) { location.hash = 'home'; return; }
  const [people, invites, draws] = await Promise.all([
    sb.from('profiles').select('id,display_name,santa_active,is_admin').order('created_at').then(ok),
    rpc('admin_list_invites'), rpc('ss_progress'),
  ]);
  const hasThisYear = draws.some(d => d.year === THIS_YEAR);
  app.innerHTML = `<h1>Admin</h1>
  <div class="card"><h2>Invite someone</h2>
    <p class="muted" style="margin-top:0">Creates a one-off link that's valid for 14 days. Add their email and we'll send it to them; otherwise copy the link and send it privately. Whoever opens it can create an account.</p>
    <div class="row"><input type="text" id="invname" class="grow" placeholder="Their name (optional)" maxlength="40"><input type="email" id="invemail" class="grow" placeholder="Their email (optional)"><button class="btn small" id="invgo">Create invite</button></div>
    <div id="invout"></div>
    ${invites.length ? `<h3 style="margin-top:18px">Unused links</h3><table>${invites.map(i => `<tr><td>${i.kind === 'join' ? 'Invite' : 'Password reset'}${i.display_name || i.target ? ': ' + esc(i.display_name || i.target) : ''}</td>
      <td class="muted">expires ${new Date(i.expires_at).toLocaleDateString('en-GB')}</td>
      <td style="text-align:right"><button class="btn small ghost" data-copy="${inviteLink(i.kind === 'join' ? 'invite' : 'reset', i.token)}">Copy link</button>
      <button class="btn small danger" data-revoke="${i.token}">Cancel</button></td></tr>`).join('')}</table>` : ''}
  </div>
  <div class="card"><h2>Members</h2><table><tr><th>Name</th><th></th></tr>
    ${people.map(p => `<tr><td>${esc(p.display_name)}${p.is_admin ? ' <span class="pill gold">admin</span>' : ''}</td>
      <td style="text-align:right"><button class="btn small ghost" data-reset="${p.id}">Password reset link</button></td></tr>`).join('')}</table></div>
  <div class="card"><h2>Secret Santa draw</h2>
    <p class="muted" style="margin-top:0">Runs on the server, and nobody (including you) sees the full list. With N people, nobody repeats a person within N−1 years. It also avoids two people simply swapping where it can.</p>
    <h3>Who's in this year</h3>
    <div class="row" style="gap:8px 18px">${people.map(p => `<label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--text);font-weight:500"><input type="checkbox" data-in="${p.id}" ${p.santa_active ? 'checked' : ''}> ${esc(p.display_name)}</label>`).join('')}</div>
    <div class="row" style="margin-top:12px"><input type="number" id="dyear" value="${hasThisYear ? THIS_YEAR + 1 : THIS_YEAR}" style="width:110px">
      <button class="btn small" id="drawgo">Draw ${people.filter(p => p.santa_active).length} people</button></div>
    <div id="drawconfirm"></div>
    <div id="drawres"></div>
    ${draws.length ? `<table style="margin-top:12px">${draws.map(d => `<tr><td>${d.year}</td><td>${d.finished} / ${d.people} finished</td><td style="text-align:right">
      <button class="btn small ${d.revealed ? 'ghost' : ''}" data-reveal="${d.year}" data-to="${!d.revealed}">${d.revealed ? 'Hide gallery' : 'Reveal gallery'}</button>
      ${d.finished === 0 ? `<button class="btn small danger" data-del="${d.year}">Delete draw</button>` : ''}</td></tr>`).join('')}</table>` : ''}
  </div>`;
  const showLink = (label, url) => { $('#invout').innerHTML = `<p>${label}</p><div class="linkbox">${esc(url)}</div><button class="btn small" style="margin-top:8px" id="cp">Copy</button>`; $('#cp').onclick = () => copy(url); $('#invout').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
  $('#invgo').onclick = e => busy(e.target, async () => {
    const email = $('#invemail').value.trim();
    if (email) {
      const r = await invite({ action: 'invite', email, display_name: $('#invname').value }, 'email');
      await pageAdmin(); showLink(`Invite emailed to ${esc(email)}. The link, in case it ends up in spam:`, inviteLink('invite', r.token));
    } else {
      const t = await rpc('admin_create_invite', { p_kind: 'join', p_display_name: $('#invname').value, p_user: null });
      await pageAdmin(); showLink('Invite link created. Send it privately:', inviteLink('invite', t));
    }
  });
  $$('[data-copy]').forEach(b => b.onclick = () => copy(b.dataset.copy));
  $$('[data-revoke]').forEach(b => b.onclick = () => busy(b, async () => { await rpc('admin_revoke_invite', { p_token: b.dataset.revoke }); pageAdmin(); }));
  $$('[data-reset]').forEach(b => b.onclick = () => busy(b, async () => {
    const t = await rpc('admin_create_invite', { p_kind: 'reset', p_display_name: null, p_user: b.dataset.reset });
    await pageAdmin(); showLink('Password reset link created. Send it to them privately:', inviteLink('reset', t));
  }));
  $$('[data-active]').forEach(b => b.onclick = () => busy(b, async () => { await rpc('admin_set_santa_active', { p_user: b.dataset.active, p_active: b.dataset.to === 'true' }); pageAdmin(); }));
  $$('[data-reveal]').forEach(b => b.onclick = () => busy(b, async () => { await rpc('ss_set_revealed', { p_year: +b.dataset.reveal, p_revealed: b.dataset.to === 'true' }); pageAdmin(); }));
  $$('[data-del]').forEach(b => b.onclick = () => {
    if (b.dataset.armed) return busy(b, async () => { await rpc('ss_delete_draw', { p_year: +b.dataset.del }); pageAdmin(); });
    b.dataset.armed = 1; b.textContent = 'Click again to delete';
  });
  // ticking someone in or out saves straight away; the draw uses whoever is ticked
  $$('[data-in]').forEach(c => c.onchange = async () => {
    c.disabled = true;
    try { await rpc('admin_set_santa_active', { p_user: c.dataset.in, p_active: c.checked }); const p = people.find(x => x.id === c.dataset.in); p.santa_active = c.checked; }
    catch (err) { c.checked = !c.checked; toast(err.message, true); }
    c.disabled = false;
    $('#drawgo').textContent = `Draw ${people.filter(p => p.santa_active).length} people`; $('#drawconfirm').innerHTML = '';
  });
  $('#drawgo').onclick = () => {
    const ins = people.filter(p => p.santa_active), out = people.filter(p => !p.santa_active);
    $('#drawconfirm').innerHTML = `<div class="notes" style="margin-top:12px">Draw <b>${+$('#dyear').value}</b> for <b>${ins.map(p => esc(p.display_name)).join(', ')}</b>${out.length ? `, with ${out.map(p => esc(p.display_name)).join(', ')} sitting out` : ''}? Everyone in it gets an email within 5 minutes.
      <div class="row" style="margin-top:10px"><button class="btn small" id="drawyes">Yes, draw it</button><button class="btn small ghost" id="drawno">Cancel</button></div></div>`;
    $('#drawno').onclick = () => $('#drawconfirm').innerHTML = '';
    $('#drawyes').onclick = e => busy(e.target, async () => {
    const r = await rpc('ss_run_draw', { p_year: +$('#dyear').value });
    await pageAdmin();
    $('#drawres').innerHTML = `<p>✅ ${r.year} drawn for ${r.people} people. ${r.repeat_pairs ? `${r.repeat_pairs} pairing(s) had happened before; the most recent was ${r.shortest_gap_years} year(s) ago, and that was the best possible.` : 'Every pairing is brand new.'} Made a mistake? "Delete draw" below also cancels the emails if they haven't gone yet.</p>`;
    });
  };
}

route();
</script>
</body>
</html>
